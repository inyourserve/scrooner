name: SEC Frames self-consistency check

on:
  workflow_dispatch:
  schedule:
    # Weekly, not daily: SEC's Frames data for one calendar quarter
    # doesn't change day to day (it fills in as companies file over the
    # following quarter or two, then stays static) -- a daily run would
    # burn the same 7 SEC requests against data that hasn't moved. Offset
    # from the other two crons' times so all three never compete for the
    # same Supabase pooler connections at once.
    - cron: "5 17 * * 1"

permissions:
  contents: read

concurrency:
  group: sec-frames-check-production
  cancel-in-progress: false

jobs:
  frames-check:
    name: Frames fetch, compare, report
    runs-on: ubuntu-latest
    # 7 SEC requests total (one per concept, each covering the WHOLE
    # active population) plus a per-company compare pass -- cheap and
    # fast, no external rate-limit concern (SEC's own client already
    # paces itself).
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require production configuration
        run: |
          test -n "$DATABASE_URL"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SEC_USER_AGENT"
      - name: Install locked dependencies
        run: uv sync --project pipeline --locked
      - name: Run Frames check (defaults to most recently completed quarter)
        run: uv run --project pipeline scrooner-frames-check run
      - name: Report findings
        if: always()
        run: uv run --project pipeline scrooner-frames-check report
