name: SEC Frames self-consistency check

on:
  workflow_dispatch:
  schedule:
    # Weekly, not daily: SEC's Frames data for one calendar quarter
    # doesn't change day to day (it fills in as companies file over the
    # following quarter or two, then stays static) -- a daily run would
    # burn the same 7 SEC requests against data that hasn't moved. Runs at
    # 06:05Z Monday, before the daily refresh and sanity crons, and shares the
    # heavy-db-jobs concurrency group below so it never overlaps them (it
    # overlapped refresh and sanity on 2026-10-19 and failed on a connection
    # timeout 40 minutes before the database restarted).
    - cron: "5 6 * * 1"

permissions:
  contents: read

# One queue for every heavy database workflow (2026-10-21). The Supabase database is
# small (256 MB shared buffers), and it restarted on 2026-10-18 and again on 2026-10-19 while
# the scheduled refresh, sanity and SEC Frames runs overlapped; the overlap also made Frames and
# sanity fail with connection timeouts. A shared group makes GitHub run them one at a time.
# GitHub keeps ONE pending run per group: a newer pending run replaces an older pending one, so
# check `gh run list` before dispatching a manual run and do not queue two. See
# doc/data-moat/team/PLAN.md "Operating rule: no overlapping heavy jobs".
concurrency:
  group: heavy-db-jobs
  cancel-in-progress: false

jobs:
  frames-check:
    name: Frames fetch, compare, report
    runs-on: ubuntu-latest
    # 7 SEC requests total (one per concept, each covering the WHOLE
    # active population) plus a per-company compare pass -- cheap and
    # fast, no external rate-limit concern (SEC's own client already
    # paces itself).
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require production configuration
        run: |
          test -n "$DATABASE_URL"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SEC_USER_AGENT"
      - name: Install locked dependencies
        run: uv sync --project pipeline --locked
      - name: Run Frames check (defaults to most recently completed quarter)
        run: uv run --project pipeline scrooner-frames-check run
      - name: Report findings
        if: always()
        run: uv run --project pipeline scrooner-frames-check report
