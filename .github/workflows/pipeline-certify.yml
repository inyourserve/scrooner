name: Certification invariants (scrooner-certify)

# Manual only. Runs the top-1000 certification suite (data-team/34, invariants I1-I11).
# DEFAULT IS A DRY RUN: findings are printed and attached as an artifact, nothing is written.
# `apply: true` writes only analytics.certification_finding and analytics.company_certification
# (migration 0097; the job refuses to run if the tables are not there).
#
# Heavy: it reads core.fact for the whole cohort (about 1.5 h for the top 986 in 2026-10-21 dry
# runs), so it joins the shared heavy-db-jobs queue and runs its shards one after another.
on:
  workflow_dispatch:
    inputs:
      shards:
        description: 'Campaign shard ids, space separated (e.g. "S001 S002"), or "all" for every shard in doc/data-moat/team/top1000/shards.csv'
        default: "all"
      apply:
        description: "Write findings and certification states (default false = dry run)"
        type: boolean
        default: false

permissions:
  contents: read

# One queue for every heavy database workflow (see pipeline-tag-library.yml for the history).
# GitHub keeps ONE pending run per group: check `gh run list` before dispatching a manual run.
concurrency:
  group: heavy-db-jobs
  cancel-in-progress: false

jobs:
  certify:
    name: Run invariants I1-I11 for the selected shards
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # The shared Settings model refuses to load without these three, although certify only
      # reads the database (first dispatch, run 40094267076, failed on all 102 shards at start).
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      SHARDS: ${{ inputs.shards }}
      APPLY: ${{ inputs.apply }}
      # Per-shard wall-clock cap (seconds) so one hung shard cannot burn the whole job cap.
      SHARD_TIMEOUT_SECS: "1800"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require production configuration
        run: |
          test -n "$DATABASE_URL"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SEC_USER_AGENT"
      - name: Install locked dependencies
        run: uv sync --project pipeline --locked
      - name: Run certification shard by shard
        run: |
          set -u
          if [ "$SHARDS" = "all" ] || [ -z "$SHARDS" ]; then
            SHARDS=$(python3 -c "import csv; print(' '.join(sorted({r['shard'].strip() for r in csv.DictReader(open('doc/data-moat/team/top1000/shards.csv'))})))")
          fi
          mode="--dry-run"
          if [ "$APPLY" = "true" ]; then mode="--apply"; fi
          mkdir -p certify-out
          failed=""
          for s in $SHARDS; do
            echo "::group::certify $s ($mode)"
            if ! timeout "$SHARD_TIMEOUT_SECS" uv run --project pipeline scrooner-certify run \
                --top1000-shard "$s" $mode --summary-only --json-out "certify-out/$s.json"; then
              echo "::error::shard $s failed or hit the ${SHARD_TIMEOUT_SECS}s cap"
              failed="$failed $s"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "failed shards:$failed"; exit 1; fi
      - name: Attach findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certify-findings
          path: certify-out/
          if-no-files-found: ignore
