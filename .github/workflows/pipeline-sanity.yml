name: Data sanity layer (yfinance cross-check)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max companies to check this run (rotates coldest-checked-first)."
        required: false
        default: "750"
  schedule:
    # Offset from pipeline-refresh.yml's 12:23 UTC cron so the two never
    # compete for the same Supabase pooler connections at once.
    - cron: "17 15 * * *"

permissions:
  contents: read

concurrency:
  group: data-sanity-layer-production
  cancel-in-progress: false

jobs:
  yfinance-cross-check:
    name: yfinance cross-check and report
    runs-on: ubuntu-latest
    # ~750 companies * 1.2s pace + the new yfinance-financials rotation
    # (200 companies, 3x request cost each) + a full-population
    # time-series pass (~20min, pure SQL, no external calls) -- bumped
    # from 60 to 90min 2026-09-08 when those two were added.
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require production configuration
        run: |
          test -n "$DATABASE_URL"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SEC_USER_AGENT"
      - name: Install locked dependencies
        run: uv sync --project pipeline --locked
      - name: Run sanity checks (rotating batch)
        run: uv run --project pipeline scrooner-sanity run --limit "${{ github.event.inputs.limit || '750' }}"
      - name: Investigate and auto-fix reconcilable findings
        if: always()
        run: uv run --project pipeline scrooner-sanity investigate
      - name: Run rendered-report parser on remaining critical findings
        # Added 2026-09-20 -- closes a real gap: tag_investigator's
        # investigate step above can only fix a concept from a TAG
        # already sitting in core.fact; APA Corp's real revenue never
        # existed there at all (SEC's own structured XBRL companyfacts
        # for it has no usable plain-revenue tag, confirmed live), so
        # every prior "investigate" run correctly reported no_match_found
        # forever. Parser 3 (doc 42) reads the filing's own RENDERED
        # statement table instead -- this step widens run-parser's own
        # gap-detection to also retry companies with an open critical
        # revenue_zero_check finding (not just zero canonical_fact rows),
        # then resolve-parser-results merges whatever it found into
        # revenue_sanity_resolved, the same display concept tag_
        # investigator writes to. First run: 19 -> 13 open critical
        # findings, including the highest-visibility one (APA Corp, a
        # real S&P 500 company) confirmed fixed end-to-end via a live
        # sanity-check rerun, not just the write succeeding.
        if: always()
        run: |
          uv run --project pipeline scrooner-map run-parser revenue
          uv run --project pipeline scrooner-map resolve-parser-results revenue
      - name: Time-series self-consistency check (full population)
        # Added 2026-09-08 -- zero external calls (pure SQL against our
        # own history), so unlike everything else in this job it isn't
        # rate-limit-bound and can cover the whole population every day,
        # not a rotating batch. Was built 2026-09-08 but never wired
        # into any cron until now -- see doc/data-moat/SYSTEMS.md.
        if: always()
        run: uv run --project pipeline scrooner-sanity timeseries
      - name: Metric plausibility check (full population)
        # Added 2026-09-27, direct request ("PE can't be higher/lower
        # than this? do this for almost all the metrics"). Zero external
        # calls (same reasoning as the time-series step above) -- checks
        # each company's most recent value per metric against a
        # CRITICAL/WATCH range grounded in the real live distribution
        # (doc/reference/47_Scrooner_Metric_Plausibility_Gates.md). First
        # live run found 7,003 critical + 7,585 watch violations,
        # including the exact live bugs the doc's own research surfaced
        # by hand (roe max 56.6M%, price_to_book max $1.29B, dividend_
        # yield max 837,700%, negative current_ratio/quick_ratio).
        if: always()
        run: uv run --project pipeline scrooner-sanity plausibility
      - name: Period completeness (which quarters are missing, and why)
        # Added 2026-09-30. Expected periods come from each company's own
        # 10-Q/10-K filings; every missing quarter/year of six key concepts
        # gets a cause (rounding conflict, absent from SEC's feed, Q4 not
        # derived, ...) in analytics.period_gap, and one finding per
        # company/concept/cause in analytics.company_data_finding. Causes
        # that stop occurring are marked fixed, so the history is kept.
        # ~8 minutes for all active companies.
        if: always()
        run: uv run --project pipeline python -m scrooner_pipeline.sanity.period_completeness
      - name: yfinance full financial statements (rotating batch)
        # Added 2026-09-08 -- deeper than the ratio check above (every
        # quarter's actual line items, not just latest-period ratios),
        # but 3x the yfinance request cost per company, so a smaller
        # daily rotation (200, vs the ratio check's 750) sharing the
        # same rate-limiter budget. Was built 2026-09-08 but had no
        # rotation of its own and no cron wiring until now.
        #
        # `investigate` (below) gained a bounded --limit 2026-09-19 --
        # found live: with no limit it re-scanned the ENTIRE accumulated
        # "major, note is null" backlog every run (18,972 findings by
        # 2026-09-19), ~0.38s/finding, ~2 hours total -- blowing this
        # job's 90-minute timeout and silently preventing "Report
        # yfinance-financials findings"/"Report findings" (the actual
        # alerting gate) from running for 5 straight days (2026-09-15
        # through 09-19). See investigate_major_findings()'s own
        # docstring in yfinance_financials/compare.py for the full
        # finding. Default limit (2000/day) clears the backlog over
        # ~10 days instead of one unbounded, timeout-blowing scan.
        if: always()
        run: |
          uv run --project pipeline scrooner-yfinance-financials seed-line-item-mapping
          uv run --project pipeline scrooner-yfinance-financials daily-rotation --limit 200
          uv run --project pipeline scrooner-yfinance-financials investigate
      - name: Report yfinance-financials findings
        if: always()
        run: uv run --project pipeline scrooner-yfinance-financials report
      - name: Cost of Revenue via rendered-report dimensional summation
        # Added 2026-09-21, closes a real, sized gap (~570 companies,
        # spread thin across dozens of unrelated sectors -- oil & gas,
        # insurance, hospitality, airlines, software) found from a direct
        # user report (Hyatt Hotels showing blank Cost of Revenue/Gross
        # Profit/Operating Expenses/Operating Income). Confirmed live:
        # a real, already-mapped tag (us-gaap:CostOfGoodsAndServicesSold)
        # exists in the filing but ONLY as several dimensional facts (one
        # per business segment), which the standard Company Facts API
        # strips entirely (doc 22's already-documented limitation, now
        # confirmed for a new concept family) -- concept_mapping could
        # never find it no matter how many tags were added. This parser
        # sums every occurrence of a cost-of-revenue-shaped label within
        # the company's own rendered primary income-statement report and
        # validates the sum against yfinance's own already-fetched figure
        # (the step above) before trusting it -- yfinance is comparison/
        # validation ONLY here, per explicit standing user direction; the
        # stored value always traces back to real, summed SEC facts.
        # Placed AFTER the yfinance fetch step above (not before, unlike
        # revenue's own parser step) since this parser's own correctness
        # depends on that data already existing for the company.
        if: always()
        run: |
          uv run --project pipeline scrooner-map run-parser cost_of_revenue
          uv run --project pipeline scrooner-map resolve-parser-results cost_of_revenue
      - name: Report findings
        if: always()
        run: uv run --project pipeline scrooner-sanity report --github-summary --fail-on-findings
