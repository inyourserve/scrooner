name: Standard extract for the resolver (FSN -> 7 JSON files, read-only)

# One dispatch replaces the manual Tag Expert steps (data-team/tags/line_map/tools/standard_run.py):
#   1. standard_run.py sql <CIKs> OUT        (the four extract queries per CIK batch)
#   2. scripts/ci/run_extract_sql.py run OUT (each OUT/<kind>-NN.sql -> OUT/<kind>.jsonl, one JSON object per row)
#   3. standard_run.py assemble OUT          (filings, notefacts, memberfacts, compfacts, zlines, clines, lentity .json)
# (plus the optional sql-le pass: filings whose face has no undimensioned value get legal-entity rows, then assemble again.)
#
# Companies: `ciks` (comma list) OR `csv_path` (a csv with a cik or company_id column). With neither, the default is every
# distinct cik of the newest data-team/tags/line_map/resolver-all110-*.csv, the list the resolver is graded on.
# The extract SQL selects by fsn.filing.company_id, successor CIK wins a shared period (48be1944).
#
# Read-only: the session is default_transaction_read_only=on, statement_timeout <= 15 min (the SQL files set 55s/115s
# per query), ONE connection, and a preflight that pauses while pg_stat_activity > 80. No SEC access, no database writes.
# Output: (a) artifact standard-extract-<run_id> = the 7 JSON files + the raw .jsonl + manifest.json;
#         (b) a commit of the 7 JSON files + manifest.json to branch data/extract-<date> (never main).
# Queue: manual-db-jobs (never beside top100-flow, cells-load/proof, fsn-load-filings). pipeline-fsn-write has its own
# group and rewrites fsn.*, so the first job waits for it (heavy_job_guard.sh wait-for-write); this workflow is NOT in
# HEAVY_WORKFLOWS because it is read-only and a write never needs to refuse because of it.
on:
  workflow_dispatch:
    inputs:
      ciks:
        description: "CIKs, comma separated (empty = use csv_path, else the resolver-all110 default)"
        default: ""
      csv_path:
        description: "Repo path of a csv with a cik or company_id column (used when ciks is empty)"
        default: ""
      batch:
        description: "CIKs per SQL batch (1..8)"
        default: "4"

permissions:
  contents: read
  actions: read

concurrency:
  group: manual-db-jobs
  cancel-in-progress: false

env:
  MAX_BACKENDS: "80"

jobs:
  wait-for-fsn-write:
    name: Main only; wait while pipeline-fsn-write is in progress
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Refuse anything but a dispatch on main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::runs only from workflow_dispatch on main (ref $GITHUB_REF, event $GITHUB_EVENT_NAME)"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: scripts/ci
      - env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/heavy_job_guard.sh wait-for-write 330

  extract:
    name: Extract (read-only database session)
    needs: wait-for-fsn-write
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PGOPTIONS: "-c default_transaction_read_only=on -c statement_timeout=900000"
      IN_CIKS: ${{ inputs.ciks }}
      IN_CSV: ${{ inputs.csv_path }}
      BATCH: ${{ inputs.batch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --project pipeline --locked
      - name: Validate inputs
        run: |
          set -eu
          printf '%s' "$BATCH" | grep -Eq '^[1-8]$' || { echo "::error::batch must be 1..8"; exit 1; }
          if [ -n "$IN_CIKS" ]; then
            printf '%s' "$IN_CIKS" | grep -Eq '^[0-9]{1,10}(, ?[0-9]{1,10})*$' || { echo "::error::ciks must be comma-separated digits"; exit 1; }
          elif [ -n "$IN_CSV" ]; then
            case "$IN_CSV" in /*|*..*) echo "::error::csv_path must be a repo-relative path"; exit 1;; esac
            [ -f "$IN_CSV" ] || { echo "::error::$IN_CSV not found in the repo"; exit 1; }
          fi
      - name: Connection preflight (pause while pg_stat_activity > 80; this run holds 1)
        run: |
          set -eu
          for i in $(seq 1 60); do
            used=$(psql "$DATABASE_URL" -tAc "select count(*) from pg_stat_activity" | tr -d ' ')
            echo "client sessions now: $used (limit $MAX_BACKENDS)"
            [ "$used" -le "$MAX_BACKENDS" ] && exit 0
            sleep 60
          done
          echo "::error::pg_stat_activity stayed above $MAX_BACKENDS for 60 minutes"; exit 1
      - name: Company list
        run: |
          set -eu
          mkdir -p out
          if [ -n "$IN_CIKS" ]; then
            src="ciks input"
            CIKS=$(pipeline/.venv/bin/python scripts/ci/run_extract_sql.py ciks --ciks "$IN_CIKS")
          elif [ -n "$IN_CSV" ]; then
            src="$IN_CSV"
            CIKS=$(pipeline/.venv/bin/python scripts/ci/run_extract_sql.py ciks --csv "$IN_CSV")
          else
            src=$(ls data-team/tags/line_map/resolver-all110-*.csv | sort | tail -1)
            CIKS=$(pipeline/.venv/bin/python scripts/ci/run_extract_sql.py ciks --csv "$src")
          fi
          echo "$CIKS" > out/ciks.txt
          echo "source: $src; $(echo "$CIKS" | tr ',' '\n' | wc -l) CIKs"
          echo "$src" > out/ciks-source.txt
      - name: 1. Write the SQL
        run: python3 data-team/tags/line_map/tools/standard_run.py sql "$(cat out/ciks.txt)" out --batch "$BATCH"
      - name: 2. Run the SQL (one read-only connection)
        run: |
          set -eu
          pipeline/.venv/bin/python scripts/ci/run_extract_sql.py run out
      - name: 3. Assemble
        run: python3 data-team/tags/line_map/tools/standard_run.py assemble out
      - name: 2b/3b. Legal-entity rows for filings without an undimensioned face value, then assemble again
        run: |
          set -eu
          python3 data-team/tags/line_map/tools/standard_run.py sql-le out
          if [ -f out/le-00.sql ]; then
            pipeline/.venv/bin/python scripts/ci/run_extract_sql.py run out --only le
            python3 data-team/tags/line_map/tools/standard_run.py assemble out
          fi
      - name: Manifest
        run: |
          set -eu
          pipeline/.venv/bin/python scripts/ci/run_extract_sql.py manifest out --out out/manifest.json \
            --run-id "$GITHUB_RUN_ID" --code-sha "$GITHUB_SHA" --ciks "$(cat out/ciks.txt)"
          python3 - <<'EOF'
          import json
          m = json.load(open('out/manifest.json'))
          need = ['filings', 'notefacts', 'memberfacts', 'compfacts', 'zlines', 'clines', 'lentity']
          missing = [k for k in need if k + '.json' not in m['files']]
          assert not missing, missing
          assert m['files']['filings.json']['rows'] > 0, 'no filings extracted'
          for k, v in m['files'].items(): print(f"{k}: {v['rows']} rows {v['sha256'][:12]}")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: standard-extract-${{ github.run_id }}
          path: |
            out/*.json
            out/*.jsonl
            out/ciks-source.txt
          retention-days: 30
          if-no-files-found: error

  commit:
    name: Commit the 7 files to data/extract-<date> (never main)
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: standard-extract-${{ github.run_id }}
          path: dl
      - name: Commit to the data branch
        run: |
          set -eu
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::main only"; exit 1; }
          d=$(date -u +%F)
          branch="data/extract-$d"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then branch="$branch-$GITHUB_RUN_ID"; fi
          case "$branch" in main|master) echo "::error::refusing main"; exit 1;; esac
          dest="data-team/tags/line_map/extracts/$d-$GITHUB_RUN_ID"
          mkdir -p "$dest"
          for f in filings notefacts memberfacts compfacts zlines clines lentity; do
            cp "dl/$f.json" "$dest/$f.json"
          done
          cp dl/ciks-source.txt "$dest/" 2>/dev/null || true
          cp dl/manifest.json "$dest/manifest.json"
          big=$(find "$dest" -type f -size +95M | head -1)
          [ -z "$big" ] || { echo "::error::$big is over 95 MB (GitHub's 100 MB limit); use the artifact"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$branch"
          git add "$dest"
          git commit -q -m "Standard extract $d (run $GITHUB_RUN_ID, code $GITHUB_SHA)"
          git push -q origin "$branch"
          echo "pushed $branch: $dest"
          echo "branch $branch, path $dest" >> "$GITHUB_STEP_SUMMARY"
