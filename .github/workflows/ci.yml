name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on branches and pull requests, but let runs on main
  # FINISH (2026-10-21). Several sessions push to main every minute or two; with
  # cancel-in-progress on main the Python tests job was cancelled before finishing
  # on nearly every push, so main almost never had a completed CI result. On main
  # GitHub now runs one at a time and keeps only the newest pending run, so every
  # few minutes a full run completes on the then-latest commit.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which suites does this change need? (2026-11-16) Most pushes to main are data-team/pipeline commits that never
  # touch the Next.js app, yet every one ran the full npm ci + lint + test + build. The Python code READS data-team/
  # and doc/ files (resolver CSVs, rulings, fix rows), so Python runs for everything except changes confined to the
  # app, design system or mind. Anything we cannot classify (new branch, force push, workflow edits) runs everything.
  # A job skipped by `if:` reports as skipped, which branch protection treats as passing.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.c.outputs.python }}
      app: ${{ steps.c.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: c
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/changed_areas.py >> "$GITHUB_OUTPUT"

  python:
    name: Python tests and correctness lint
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A real Postgres for the DB-backed tests (added 2026-11-03). Before this, every
    # test that needs SCROONER_TEST_DATABASE_URL was skipped in CI (107 of them), so
    # no SQL path had ever run here. Never mark a failing DB test as skipped to get green.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scrooner_test
          POSTGRES_PASSWORD: scrooner_test
          POSTGRES_DB: scrooner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scrooner_test -d scrooner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: scrooner_test
      PGPASSWORD: scrooner_test
      PGDATABASE: scrooner_test
      SCROONER_TEST_DATABASE_URL: postgresql://scrooner_test:scrooner_test@localhost:5432/scrooner_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            pipeline/uv.lock
            apps/backend/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked pipeline dependencies
        run: uv sync --project pipeline --locked --dev
      - name: Install locked backend dependencies
        run: uv sync --project apps/backend --locked --dev
      - name: Prepare the test database (Supabase-owned objects, then every migration)
        run: |
          set -euo pipefail
          psql --set ON_ERROR_STOP=1 --file scripts/ci/bootstrap_supabase.sql
          for migration in pipeline/db/migrations/*.sql; do
            psql --set ON_ERROR_STOP=1 --file "$migration"
          done
      # Storage read for the tests that need an archived >5 MB file (tag library.csv, common/repo_archive.py). conftest
      # pins SUPABASE_* to placeholders; only the archived_repo_file fixture reads these. Unset (fork PR): those tests
      # skip with the reason; set but the download fails: they fail.
      - name: Pipeline tests
        env:
          SCROONER_TEST_STORAGE_URL: ${{ secrets.SUPABASE_URL }}
          SCROONER_TEST_STORAGE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: uv run --project pipeline pytest pipeline/tests -rs
      # The structural resolver and tag library (data-team/tags) decide served values; their tests gate main too
      # (Ritwik measurement 2026-11-17: 184 resolver tests ran only in tag-library-learn, which had never run)
      - name: Resolver and tag-library tests
        run: uv run --project pipeline pytest data-team/tags/line_map/tools data-team/tags/library -rs -p no:cacheprovider
      # One tag library (2026-11-22): every resolver release rebuilds it (line_map/CHANGELOG.md, README "Releasing").
      # Fails while library/coverage.json names an older resolver version than the newest in line_map/resolver/*.csv.
      - name: Tag library built for the newest resolver version
        run: python3 data-team/tags/library/build_library.py --check-version
      - name: Backend tests
        working-directory: apps/backend
        run: uv run pytest tests
      - name: Compile Python sources
        run: uv run --project pipeline python -m compileall -q pipeline/src apps/backend
      - name: Required correctness lint
        run: uvx ruff check --select E9,F63,F7,F82 pipeline/src apps/backend

  app:
    name: Next.js frontend tests and production build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/app/package-lock.json
      - name: Install locked dependencies
        working-directory: apps/app
        run: npm ci
      - name: Lint
        working-directory: apps/app
        run: npm run lint
      - name: Test
        working-directory: apps/app
        run: npm test
      - name: Build
        working-directory: apps/app
        run: npm run build

  repository-integrity:
    name: Migrations, documentation, and secrets
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scrooner_test
          POSTGRES_PASSWORD: scrooner_test
          POSTGRES_DB: scrooner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scrooner_test -d scrooner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: scrooner_test
      PGPASSWORD: scrooner_test
      PGDATABASE: scrooner_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check migration sequence
        run: python scripts/check_migrations.py
      - name: Bootstrap Supabase-owned objects
        run: psql --set ON_ERROR_STOP=1 --file scripts/ci/bootstrap_supabase.sql
      - name: Apply every migration to clean PostgreSQL
        run: |
          set -euo pipefail
          for migration in pipeline/db/migrations/*.sql; do
            psql --set ON_ERROR_STOP=1 --file "$migration"
          done
      - name: Exercise backup and restore round trip
        env:
          SCROONER_ALLOW_EPHEMERAL_RESTORE: "1"
        run: |
          # pg_dump / pg_restore come from the same postgres image as the service
          # (see scripts/ci/pgbin/pg_dump); the runner's own client tools drifted newer
          # than the server and wrote a setting the server rejects.
          export PATH="$PWD/scripts/ci/pgbin:$PATH"
          bash scripts/verify_backup_restore.sh
      - name: Reject new files over 10 MB
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python scripts/ci/check_large_files.py
      - name: Check local documentation links
        run: python scripts/check_docs.py
      - name: Check common secret patterns
        run: python scripts/check_secrets.py
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  advisory-quality:
    name: Advisory formatting, typing, and dependency audits
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/app/package-lock.json
      # Each step below is `if: always()`: a failure in one used to skip every
      # later step, so mypy and both dependency audits produced no signal at all
      # for as long as Ruff failed (found 2026-10-10: 93 mypy errors, 3 urllib3
      # advisories, and 1 critical + 2 high npm advisories were all hidden).
      # --no-emit-project: the exported `-e .` line made pip-audit fail to install.
      # --explicit-package-bases: found 2026-10-13 -- doc 54's caching work added
      # apps/backend/reference_data.py alongside apps/backend/routers/reference_data.py.
      # Without this flag mypy treats both as the same top-level module ("Duplicate
      # module named 'reference_data'") and aborts with 1 error, hiding every real
      # finding again (same failure shape the comment above already names, caused by
      # a different committed change this time, not Ruff).
      - name: Ruff formatting debt
        if: always()
        run: uvx ruff format --check pipeline/src apps/backend
      - name: Python type analysis
        if: always()
        run: uvx mypy --ignore-missing-imports --follow-imports=skip --explicit-package-bases pipeline/src apps/backend
      - name: Export and audit pipeline dependencies
        if: always()
        run: |
          uv export --project pipeline --locked --no-dev --no-emit-project --format requirements-txt --output-file /tmp/pipeline-requirements.txt
          uvx pip-audit --requirement /tmp/pipeline-requirements.txt
      - name: Audit frontend dependencies
        if: always()
        working-directory: apps/app
        run: npm audit --omit=dev
