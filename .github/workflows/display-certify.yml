name: Display certification (approver)

# Manual. Runs pipeline/scripts/certify_display.py --live for certification requests
# (data-team/strategy/approvals/requests/). Method: CERTIFICATION-METHOD-2026-11-16.md.
# Read-only: indexed SELECTs on fsn.* under a 15 s statement_timeout, one connection, no SEC
# downloads. It writes nothing to the database or to main. The verdicts, evidence and JSON certificates
# (schema display-certificate/1) are pushed to branch certify-out/run-<run id> and attached
# as an artifact and printed in the job summary; the approver reads them and commits the verdict.
on:
  workflow_dispatch:
    inputs:
      requests:
        description: 'Request files, space separated, or "pending" for every request without a certificate or final-draw file'
        default: "pending"

permissions:
  # write only to push the outputs to a throwaway certify-out/run-<id> branch (never main); the approver
  # reviews that branch and commits the verdict and JSON certificate to main
  contents: write

concurrency:
  group: display-certify
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # The shared Settings model refuses to load without these, although this job only reads.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      REQUESTS: ${{ inputs.requests }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --project pipeline --locked
      - name: Certify
        run: |
          set -u
          A=data-team/strategy/approvals
          if [ "$REQUESTS" = "pending" ] || [ -z "$REQUESTS" ]; then
            REQUESTS=""
            for r in $A/requests/*-request-*.md; do
              t=$(basename "$r" | sed 's/-request-.*//')
              sha=$(grep -o 'sha256: `[0-9a-f]\{64\}`' "$r" | grep -o '[0-9a-f]\{64\}' | head -1)
              # pending = no certificate or final-draw file for this ticker cites the request's coverage sha256
              # (a date test missed a second request on the same day as an earlier verdict)
              if [ -z "$sha" ] || ! grep -lq "$sha" $A/${t}-certificate-*.md $A/${t}-final-draw-*.md 2>/dev/null; then
                REQUESTS="$REQUESTS $r"
              fi
            done
          fi
          echo "requests:$REQUESTS"
          mkdir -p cert-out
          # registry.csv = one latest row per company; registry-history.csv = every verdict (certify_display rewrites
          # the first from the second). Copy both so the approver can commit both files from cert-out/ as they are.
          cp $A/registry.csv cert-out/registry.csv 2>/dev/null || true
          cp $A/registry-history.csv cert-out/registry-history.csv 2>/dev/null || true
          for r in $REQUESTS; do
            echo "::group::$r"
            # approver-committed filing reads of the drawn cells the automated checker could not settle:
            # $A/reads/<TICKER>-<first 12 hex of the request's coverage sha256>.csv (draw_check.load_reads)
            t=$(basename "$r" | sed 's/-request-.*//')
            sha=$(grep -o 'sha256: `[0-9a-f]\{64\}`' "$r" | grep -o '[0-9a-f]\{64\}' | head -1)
            READS=""
            rf="$A/reads/${t}-$(printf %s "$sha" | cut -c1-12).csv"
            if [ -n "$sha" ] && [ -f "$rf" ]; then READS="--reads $rf"; echo "reads: $rf"; fi
            timeout 300 uv run --project pipeline python pipeline/scripts/certify_display.py \
              --request "$r" --live $READS --out-dir cert-out --registry cert-out/registry.csv || echo "exit $? for $r"
            echo "::endgroup::"
          done
          for f in cert-out/*-display-cert-*.md; do [ -f "$f" ] && { cat "$f"; echo; } >> "$GITHUB_STEP_SUMMARY"; done
          # also in the log, so a session without artifact access can read the findings
          for f in cert-out/*-display-cert-*.md; do [ -f "$f" ] && { echo "===== $f"; cat "$f"; }; done
          for f in cert-out/*-evidence.csv; do [ -f "$f" ] && { echo "===== $f"; grep -v ',MATCH,\|,INFO,' "$f"; }; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: display-certification
          path: cert-out/
          if-no-files-found: ignore
      - name: Publish outputs to a review branch (never main)
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -eu
          ls cert-out/*-display-cert-* >/dev/null 2>&1 || { echo "nothing to publish"; exit 0; }
          B="certify-out/run-$RUN_ID"
          git config user.name "display-certify"
          git config user.email "display-certify@users.noreply.github.com"
          git checkout --orphan "$B"
          git rm -rq --cached . >/dev/null
          git add -f cert-out/
          git commit -qm "display-certify outputs, run $RUN_ID (for approver review; not a verdict)"
          git push -q origin "HEAD:refs/heads/$B"
          echo "published to branch $B"
