name: Shared reader machine pass (ranks 301-400)

# Dhairya 2026-11-12: one method for every reader. Runs the shared tool data-team/companies/reads/tools/docmap.py
# (copied unchanged from origin/work/reads/401-500 @de14aace) in Actions, because it sends its own SEC requests:
# the User-Agent contact comes from the repo's SEC_USER_AGENT secret (founder's choice: no session sends a contact
# address). sec.gov only, 0.4 requests per second (the tool's own limit). Its cache is seeded from the documents the
# sec-reads-fetch run already stored, so they are not fetched twice. Range: pipeline/scripts/reads/shared_request.txt.
on:
  push:
    branches: [work/reads/301-400]
    paths: [pipeline/scripts/reads/shared_request.txt]

permissions:
  contents: read
  actions: read

concurrency:
  group: sec-reads-fetch
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Documents already fetched (sec-reads-fetch run 43276220884)
        uses: actions/download-artifact@v4
        with:
          name: sec-docs-4b645ff645104c476a4496a960a8b8883de77c2a
          run-id: 43276220884
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: sec_docs
        continue-on-error: true
      - name: Earlier machine pass cache (shared run 43285759679)
        uses: actions/download-artifact@v4
        with:
          name: shared-reads-15210537b0dbd7c64530e49a7f5da6d7e64348b5
          run-id: 43285759679
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prev
        continue-on-error: true
      - name: Note and lease pages (sec-reads-fetch run 43292258274)
        uses: actions/download-artifact@v4
        with:
          name: sec-docs-bd5038eb8530f5e2e84ad35deb548617e4805df3
          run-id: 43292258274
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: sec_docs2
        continue-on-error: true
      - name: Seed the tool cache
        run: |
          mkdir -p tool_cache
          if [ -d prev/tool_cache ]; then cp -n prev/tool_cache/* tool_cache/; fi
          if [ -d sec_docs ]; then python3 -I pipeline/scripts/reads/seed_tool_cache.py sec_docs tool_cache; fi
          if [ -d sec_docs2 ]; then python3 -I pipeline/scripts/reads/seed_tool_cache.py sec_docs2 tool_cache; fi
          ls tool_cache | wc -l
      - name: Machine pass (0.4 requests per second)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          umask 077
          printf '%s' "${SEC_USER_AGENT#Scrooner research }" > "$RUNNER_TEMP/sec_contact"
          export SEC_CONTACT_FILE="$RUNNER_TEMP/sec_contact"
          read lo hi < pipeline/scripts/reads/shared_request.txt
          mkdir -p reads_out
          python3 -I data-team/companies/reads/tools/docmap.py data-team/strategy/data/cohort_v1_1_proposal_2026-10-24.csv \
            "$lo" "$hi" reads_out tool_cache reads_out/inbox.md
          rm -f "$RUNNER_TEMP/sec_contact"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-reads-${{ github.sha }}
          path: |
            reads_out/
            tool_cache/
          retention-days: 30
