name: Tag library auto rebuild (resolver change on main -> library + pattern detectors, no database)

# Interconnection map (data-team/SYSTEMS.md, founder 2026-11-22 "everything should be interconnected so well"):
# every push to main that changes data-team/tags/line_map/resolver/** (a resolver release) rebuilds the tag library
# from the committed inputs, so the library never lags the resolver version (scorecard row 6).
#   1. data-team/tags/library/pattern_detectors.py (when present on main; no --live, so no database) -> pattern_hits.csv
#   2. data-team/tags/library/build_library.py (PYTHONHASHSEED=0: set order is part of the output, so it is pinned)
#   3. the library tests; then, ONLY if library.csv differs from the storage manifest's current version or
#      pattern_hits.csv changed (a rebuild that changes only dates/CHANGELOG is discarded):
#   4. library.csv (~15 MB) and library.json go to Supabase Storage bucket repo-archive, content-addressed, with a
#      round-trip sha256 check and one row each in data-team/strategy/storage-manifest.csv
#      (pipeline/src/scrooner_pipeline/common/repo_archive.py; founder rule 2026-11-20: no generated file over 5 MB in
#      git). The first run also removes them from git (they are in .gitignore); readers (build_library.py's changelog
#      diff, mapper/hide_audit.py) fetch the manifest version when the file is not in git.
#   5. commit only the small outputs (pattern_hits.csv, INDEX.md, CHANGELOG.md, coverage.json, library.schema.json,
#      browser.html, the manifest, and the generated block of every data-team/tags/cards/*.md), each checked under 5 MB.
#      A committed coverage.json older than the newest resolver version (`build_library.py --check-version`, the ci.yml
#      gate) always commits, even when library.csv is unchanged.
# Unlike tag-library-learn.yml (learner -> data branch, reviewed by hand), this runs no learner and fetches nothing
# from SEC: it regenerates files that are a pure function of what is already on main, so it commits to main directly.
# Secrets: SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY for Storage only (no database). Its own push (GITHUB_TOKEN) starts
# no workflow, so it cannot loop. Retry pattern: reset to origin/main and rebuild on every try (idempotent: the same
# content goes to the same storage path), up to 30 tries.
on:
  push:
    branches: [main]
    paths:
      - "data-team/tags/line_map/resolver/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tag-library-auto-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pytest
      - name: Rebuild, test, upload the large files, commit the small ones if the library changed
        run: |
          set -uo pipefail
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_ROLE_KEY"
          L=data-team/tags/library
          RA=pipeline/src/scrooner_pipeline/common/repo_archive.py
          MAN=data-team/strategy/storage-manifest.csv
          SMALL="$L/pattern_hits.csv $L/INDEX.md $L/CHANGELOG.md $L/coverage.json $L/library.schema.json $L/browser.html $MAN $(ls data-team/tags/cards/*.md)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 30); do
            git fetch -q origin main && git reset -q --hard origin/main || { sleep $((RANDOM % 20 + 3)); continue; }
            # the committed coverage.json names an older resolver than resolver/*.csv: always commit (the ci.yml gate)
            stale=0; python3 $L/build_library.py --check-version >/dev/null || stale=1
            if [ -f $L/pattern_detectors.py ]; then python3 $L/pattern_detectors.py | tail -5 || { echo "::error::pattern detectors failed"; exit 1; }; fi
            python3 $L/build_library.py | tail -1 | tee /tmp/library-summary.json || { echo "::error::build_library failed"; exit 1; }
            NEW=$(sha256sum $L/library.csv | cut -d' ' -f1)
            CUR=$(python3 -c "import importlib.util as u,sys; s=u.spec_from_file_location('ra',sys.argv[1]); m=u.module_from_spec(s); s.loader.exec_module(m); r=m.latest('data-team/tags/library/library.csv'); print(r['sha256'] if r else '')" $RA)
            TRACKED=0; git ls-files --error-unmatch $L/library.csv >/dev/null 2>&1 && TRACKED=1
            if [ "$stale" = 0 ] && [ "$NEW" = "$CUR" ] && [ "$TRACKED" = 0 ] && git diff --quiet -- $L/pattern_hits.csv; then
              echo "library ($NEW) and pattern hits unchanged at $(git rev-parse --short HEAD): nothing to commit"; git checkout -q -- .; exit 0
            fi
            if [ "$i" -eq 1 ]; then python3 -m pytest -q -p no:cacheprovider $L || { echo "::error::library tests failed: nothing uploaded or committed"; exit 1; }; fi
            python3 $RA upload $L/library.csv $L/library.json || { echo "::error::storage upload failed"; exit 1; }
            [ "$TRACKED" = 1 ] && git rm -q --cached $L/library.csv $L/library.json
            for f in $SMALL; do
              [ -f "$f" ] || continue
              [ "$(wc -c < "$f")" -lt 5242880 ] || { echo "::error::$f is 5 MB or more: not committed (founder rule 2026-11-20)"; exit 1; }
              git add "$f"
            done
            V=$(python3 -c "import json; print(json.load(open('/tmp/library-summary.json'))['resolver_version'])" 2>/dev/null || echo unknown)
            git commit -q -m "Tag library rebuilt for $V: library.csv ${NEW:0:12} in Storage (tag-library-auto-rebuild run $GITHUB_RUN_ID)"
            git push -q origin HEAD:main && { echo "pushed"; git log -1 --stat | tail -12 >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            sleep $((RANDOM % 20 + 3))
          done
          echo "::error::push failed after retries"; exit 1
