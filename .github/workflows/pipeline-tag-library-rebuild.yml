name: Company x tag x metric library rebuild

# Regenerates analytics.tag_library_entry and analytics.resolver_decision (migration 0128) from company_tag_map,
# the newest data-team/tags/line_map/resolver-all110-*.csv, cell_proof, the certificates in
# data-team/strategy/approvals/ and the Tag Expert's files (data-team/tags/rules, library, line_map/rules/polarity.csv).
# The repo files stay the reviewed source; the database is the queryable copy. Mapper: mapper/tag_library_rebuild.py.
#
# Dry run by default: reads only, prints the plan (rows to insert / update / delete). A resolver-file change on main
# runs the dry run only. Apply = manual dispatch from main with apply=true, and only after migration 0128 is applied
# on the founder's typed go; until then the command refuses with a clear message (exit 2), which a push-triggered
# run reports as a warning instead of a failure. Light job (about 70k small rows, batches of 2,000, one connection).
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the library tables (default false = dry run). Only honoured on main."
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "data-team/tags/line_map/resolver-all110-*.csv"
      - "data-team/tags/line_map/resolver/*.csv"

permissions:
  contents: read

# Own queue: a push-triggered dry run must not cancel or wait behind the heavy-db-jobs queue.
concurrency:
  group: library-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rebuild company x tag x metric library (${{ inputs.apply && 'apply' || 'dry run' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require production configuration
        run: |
          test -n "$DATABASE_URL"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SEC_USER_AGENT"
      - name: Install locked dependencies
        run: uv sync --project pipeline --locked
      - name: Rebuild (dry run unless apply=true on main)
        env:
          APPLY: ${{ inputs.apply }}
          EVENT: ${{ github.event_name }}
        run: |
          flag=""
          if [ "$APPLY" = "true" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::apply runs only from main (ref is $GITHUB_REF)"; exit 1
            fi
            flag="--apply"
          fi
          set +e
          uv run --project pipeline scrooner-map rebuild-company-tag-library $flag
          code=$?
          set -e
          if [ "$code" -eq 2 ] && [ "$EVENT" = "push" ]; then
            echo "::warning::library tables not in the database yet (migration 0128 not applied); dry run skipped"
            exit 0
          fi
          exit $code
