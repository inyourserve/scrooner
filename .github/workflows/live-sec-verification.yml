name: Live SEC verification

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 1"

permissions:
  contents: read

jobs:
  sec-contract:
    name: Official SEC endpoint contract
    runs-on: ubuntu-latest
    env:
      SCROONER_LIVE_SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require declared SEC contact identity
        run: test -n "$SCROONER_LIVE_SEC_USER_AGENT"
      - name: Install locked dependencies
        run: uv sync --project pipeline --locked --dev
      - name: Run opt-in live checks
        run: uv run --project pipeline pytest pipeline/tests/live -m live
