name: Mind health

on:
  push:
    paths: ["mind/**", "CLAUDE.md", "pipeline/CLAUDE.md", "data-team/**"]
  pull_request:
    paths: ["mind/**", "CLAUDE.md", "pipeline/CLAUDE.md", "data-team/**"]

permissions:
  contents: read

jobs:
  mind:
    name: Mind tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        working-directory: mind
        run: python -m unittest test_mind
      # Beta: advisory only. Entries may cite docs another session has not pushed yet,
      # so a failure here is a hint to fix a path, not a blocker.
      - name: Lint entries (advisory)
        continue-on-error: true
        run: python mind/mind.py lint
