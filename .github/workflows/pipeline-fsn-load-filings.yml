name: FSN load missing filings (EDGAR increment, CIK list)

# Manual only, main only. Loads the periodic filings (10-K, 10-Q, 20-F, 40-F and their amendments, period on or after
# 2014-01-01) of the given CIKs that core.filing holds and fsn.filing does not, built from each filing's own XBRL on
# EDGAR (`scrooner-fsn nightly`, <= 2 SEC requests per second through the shared limiter, sec.gov only, declared
# User-Agent), then `scrooner-fsn load --increment` (adds or replaces those accessions only; every other filing is
# untouched, one transaction per company). Writes fsn.* only: no canonical_fact, no mapper, no pilot.
#   apply=false (default): builds the filings (reads SEC and the database), then `load --increment --dry-run`
#                          (read-only transaction): reports what would be inserted, replaced or held. Writes nothing.
#   apply=true:            PRODUCTION WRITE to fsn.*; dispatch only on the founder's typed go-ahead.
# Queue: the manual-db-jobs group (never beside top100-flow, cells-load, cells-proof). The guard
# (scripts/ci/heavy_job_guard.sh) treats this workflow as an FSN write: the top-100 flow, refresh, sanity and the
# other heavy jobs wait for it, and pipeline-fsn-write.yml refuses to start beside it. It waits for a running
# pipeline-fsn-write.yml itself.
on:
  workflow_dispatch:
    inputs:
      ciks:
        description: "Comma-separated CIKs (core.company.cik, 10 digits or fewer)"
        required: true
      since:
        description: "Window start YYYY-MM-DD: filings filed on or after (default = the whole history since 2014)"
        default: "2014-01-01"
      max_minutes:
        description: "Fetch budget in minutes; the rest is deferred and reported (rerun to finish)"
        default: "150"
      apply:
        description: "true = load into fsn.* (production write); false = build and dry-run only"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: manual-db-jobs
  cancel-in-progress: false

env:
  MAX_BACKENDS: "60"

jobs:
  wait-for-fsn-write:
    name: Main only; wait while pipeline-fsn-write is in progress
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Refuse anything but a dispatch on main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::runs only from workflow_dispatch on main (ref $GITHUB_REF, event $GITHUB_EVENT_NAME)"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: scripts/ci
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAVY_GUARD_SELF: pipeline-fsn-load-filings.yml
        run: scripts/ci/heavy_job_guard.sh wait-for-write 330

  load:
    name: Build and load increment
    needs: wait-for-fsn-write
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      SCROONER_EDGAR_MAX_RPS: "2"
      CIKS: ${{ inputs.ciks }}
      SINCE: ${{ inputs.since }}
      MAX_MINUTES: ${{ inputs.max_minutes }}
      APPLY: ${{ inputs.apply }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate inputs
        run: |
          set -eu
          printf '%s' "$CIKS" | grep -Eq '^[0-9]{1,10}(,[0-9]{1,10})*$' || { echo "::error::ciks must be comma-separated digits"; exit 1; }
          printf '%s' "$SINCE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "::error::since must be YYYY-MM-DD"; exit 1; }
          printf '%s' "$MAX_MINUTES" | grep -Eq '^[0-9]{1,3}$' || { echo "::error::max_minutes must be a number"; exit 1; }
          [ "$MAX_MINUTES" -le 200 ] || { echo "::error::max_minutes must be at most 200"; exit 1; }
      - name: No heavy database job running or queued (apply only)
        if: ${{ inputs.apply }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAVY_GUARD_SELF: pipeline-fsn-load-filings.yml
        run: scripts/ci/heavy_job_guard.sh refuse-if-heavy
      - name: Connection headroom
        run: |
          set -eu
          used=$(psql "$DATABASE_URL" -tAc "select count(*) from pg_stat_activity where backend_type = 'client backend'")
          echo "client backends now: $used; this run holds at most 2"
          if [ $((used + 2)) -gt "$MAX_BACKENDS" ]; then echo "::error::$used + 2 would exceed $MAX_BACKENDS of 90"; exit 1; fi
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --project pipeline --locked
      - name: Build the missing filings from EDGAR (reads the database and sec.gov at <= 2 requests/s; local files only)
        run: |
          mkdir -p out
          uv run --project pipeline scrooner-fsn nightly --out out/companies --ciks "$CIKS" --since "$SINCE" \
            --max-minutes "$MAX_MINUTES" --report out/nightly.json
      - name: Dry run (read-only transaction, nothing written)
        if: ${{ !inputs.apply }}
        run: |
          set -eu
          ciks=$(cat out/companies/ciks.txt 2>/dev/null || true)
          [ -n "$ciks" ] || { echo "no filing built"; exit 0; }
          uv run --project pipeline scrooner-fsn load --companies out/companies --ciks "$ciks" --increment --dry-run --report out/load-plan.json
      - name: Load fsn.* (PRODUCTION WRITE, increment of those accessions only)
        if: ${{ inputs.apply }}
        run: |
          set -eu
          ciks=$(cat out/companies/ciks.txt 2>/dev/null || true)
          [ -n "$ciks" ] || { echo "no filing built"; exit 0; }
          uv run --project pipeline scrooner-fsn load --companies out/companies --ciks "$ciks" --increment --report out/load.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fsn-load-filings-${{ github.run_id }}
          path: |
            out/nightly.json
            out/load-plan.json
            out/load.json
          if-no-files-found: ignore
          retention-days: 30
