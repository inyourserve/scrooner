name: SEC Tag Library rebuild

on:
  workflow_dispatch:
  schedule:
    # Weekly, Sunday: a full rebuild aggregates all of core.fact (~76M rows,
    # ~1h), too long to add to the daily refresh job's 90-minute budget.
    # Offset from the other crons so they don't compete for pooler connections.
    - cron: "15 19 * * 0"

permissions:
  contents: read

concurrency:
  group: sec-tag-library-production
  cancel-in-progress: false

jobs:
  tag-library:
    name: Rebuild company x tag, tag library, concept lineage
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require production configuration
        run: |
          test -n "$DATABASE_URL"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SEC_USER_AGENT"
      - name: Install locked dependencies
        run: uv sync --project pipeline --locked
      - name: Build tag library
        run: uv run --project pipeline scrooner-map build-tag-library
      - name: Top unmapped tags among companies missing total debt
        if: always()
        run: uv run --project pipeline scrooner-map gap-tags total_debt_resolved --period-type instant --limit 20
