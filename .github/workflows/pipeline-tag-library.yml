name: SEC Tag Library rebuild

# Manual only (founder direction 2026-09-27): companies file the same tags
# period after period, so the library is built once and rebuilt only after
# WE change a concept_mapping or resolver -- that is what changes which tag
# backs our values. Full rebuild aggregates all of core.fact (~1h).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sec-tag-library-production
  cancel-in-progress: false

jobs:
  tag-library:
    name: Rebuild company x tag, tag library, concept lineage
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require production configuration
        run: |
          test -n "$DATABASE_URL"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SEC_USER_AGENT"
      - name: Install locked dependencies
        run: uv sync --project pipeline --locked
      - name: Build tag library
        run: uv run --project pipeline scrooner-map build-tag-library
      - name: Top unmapped tags among companies missing total debt
        if: always()
        run: uv run --project pipeline scrooner-map gap-tags total_debt_resolved --period-type instant --limit 20
