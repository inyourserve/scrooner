name: SEC Tag Library rebuild

# Manual, plus a daily 23:00Z run since 2026-10-23 (founder direction 2026-09-27 was manual only): companies file the same tags
# period after period, so the library is built once and rebuilt only after
# WE change a concept_mapping or resolver -- that is what changes which tag
# backs our values. Full rebuild aggregates all of core.fact (~1h).
on:
  workflow_dispatch:
  # Daily after the refresh (12:23) and sanity (15:17) schedules, inside the quiet window. Added
  # 2026-10-23 when the step moved out of pipeline-refresh.yml: it needs more than 90 minutes.
  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: read

# One queue for every heavy database workflow (2026-10-21). The Supabase database is
# small (256 MB shared buffers), and it restarted on 2026-10-18 and again on 2026-10-19 while
# the scheduled refresh, sanity and SEC Frames runs overlapped; the overlap also made Frames and
# sanity fail with connection timeouts. A shared group makes GitHub run them one at a time.
# GitHub keeps ONE pending run per group: a newer pending run replaces an older pending one, so
# check `gh run list` before dispatching a manual run and do not queue two. See
# doc/data-moat/team/PLAN.md "Operating rule: no overlapping heavy jobs".
concurrency:
  group: heavy-db-jobs
  cancel-in-progress: false

jobs:
  tag-library:
    name: Rebuild company x tag, tag library, concept lineage
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require production configuration
        run: |
          test -n "$DATABASE_URL"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SEC_USER_AGENT"
      - name: Install locked dependencies
        run: uv sync --project pipeline --locked
      - name: Build tag library
        run: uv run --project pipeline scrooner-map build-tag-library
      - name: Top unmapped tags among companies missing total debt
        if: always()
        run: uv run --project pipeline scrooner-map gap-tags total_debt_resolved --period-type instant --limit 20
