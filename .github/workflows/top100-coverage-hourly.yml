name: Top-100 coverage export (hourly, opt-in, read-only on the DB)

# Rebuilds data-team/strategy/top100-coverage.csv and top100-coverage-summary.csv from the live proof verdicts and
# commits them to main (summary hourly, full CSV daily; full CSV as an artifact every run). The database session is read-only (default_transaction_read_only=on).
# OPT-IN: the hourly schedule only does anything when the repository variable TOP100_COVERAGE_HOURLY is "true"
# (Settings, Secrets and variables, Variables). A manual dispatch from main always runs.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  # GitHub drops scheduled runs under load (2026-11-16: only the 23:59Z slot ran between 00:17 and 04:17Z), so the
  # export also runs whenever a top-100 batch finishes: coverage is fresh after every batch whatever the cron does.
  workflow_run:
    workflows: ["Top-100 per-company flow (scripts/top100_flow.sh)"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: top100-coverage-hourly
  cancel-in-progress: false

jobs:
  export:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' || vars.TOP100_COVERAGE_HOURLY == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --project pipeline --locked
      - name: Rebuild the coverage export (read-only session)
        env:
          PGOPTIONS: "-c default_transaction_read_only=on -c statement_timeout=900000"
          PYTHONPATH: pipeline/src
        run: pipeline/.venv/bin/python pipeline/scripts/top100_coverage.py data-team/strategy
      # Repo slimming (founder-approved 2026-11-16): the full CSV is ~9 MB; committed hourly it would add 24 versions a
      # day to git history. Every run uploads it as an artifact (90 days); git gets the summary every hour and the full
      # CSV once a day (the 00:17Z run) or on a manual dispatch, so agents reading it from main are at most a day stale.
      - uses: actions/upload-artifact@v4
        with:
          name: top100-coverage-${{ github.run_id }}
          path: data-team/strategy/top100-coverage.csv
          retention-days: 90
      - name: Commit the changed files
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -u
          files="data-team/strategy/top100-coverage-summary.csv"
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "workflow_run" ] || [ "$(date -u +%H)" = "00" ]; then
            files="$files data-team/strategy/top100-coverage.csv"
          fi
          if [ -z "$(git status --porcelain -- $files)" ]; then
            echo "no change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in $files; do cp "$f" "$RUNNER_TEMP/"; done
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            for f in $files; do cp "$RUNNER_TEMP/$(basename "$f")" "$f"; done
            git add $files
            git diff --cached --quiet && { echo "no change against main"; exit 0; }
            git commit -q -m "Top-100 coverage export $(date -u +%Y%m%dT%H%MZ) (hourly workflow, read-only rebuild)"
            git push -q origin HEAD:main && { echo pushed; exit 0; }
            sleep $((RANDOM % 8 + 2))
          done
          echo "::error::push failed after retries"; exit 1
