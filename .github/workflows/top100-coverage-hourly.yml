name: Top-100 coverage export (hourly, opt-in, read-only on the DB)

# Rebuilds data-team/strategy/top100-coverage.csv and top100-coverage-summary.csv from the live proof verdicts and
# commits them to main. The database session is read-only (default_transaction_read_only=on).
# OPT-IN: the hourly schedule only does anything when the repository variable TOP100_COVERAGE_HOURLY is "true"
# (Settings, Secrets and variables, Variables). A manual dispatch from main always runs.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: top100-coverage-hourly
  cancel-in-progress: false

jobs:
  export:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.TOP100_COVERAGE_HOURLY == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --project pipeline --locked
      - name: Rebuild the coverage export (read-only session)
        env:
          PGOPTIONS: "-c default_transaction_read_only=on -c statement_timeout=900000"
          PYTHONPATH: pipeline/src
        run: pipeline/.venv/bin/python pipeline/scripts/top100_coverage.py data-team/strategy
      - name: Commit the two files if they changed
        run: |
          set -u
          if [ -z "$(git status --porcelain -- data-team/strategy/top100-coverage.csv data-team/strategy/top100-coverage-summary.csv)" ]; then
            echo "no change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data-team/strategy/top100-coverage.csv data-team/strategy/top100-coverage-summary.csv "$RUNNER_TEMP/"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/top100-coverage.csv" "$RUNNER_TEMP/top100-coverage-summary.csv" data-team/strategy/
            git add data-team/strategy/top100-coverage.csv data-team/strategy/top100-coverage-summary.csv
            git commit -q -m "Top-100 coverage export $(date -u +%Y%m%dT%H%MZ) (hourly workflow, read-only rebuild)"
            git push -q origin HEAD:main && { echo pushed; exit 0; }
            sleep $((RANDOM % 8 + 2))
          done
          echo "::error::push failed after retries"; exit 1
