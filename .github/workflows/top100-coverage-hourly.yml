name: Top-100 coverage export (hourly, opt-in, read-only on the DB)

# Rebuilds the top-100 coverage export from the live proof verdicts and commits ONLY top100-coverage-summary.csv to main.
# The ~11 MB per-cell top100-coverage.csv is never committed any more (Dhairya rule 2026-11-21: every worktree carried the
# repo's tracked generated data); it is uploaded as a run artifact (90 days) and will move to Supabase Storage.
# The database session is read-only (default_transaction_read_only=on).
# ATOMIC (scale plan 2026-11-17, section 6 item 1): the export is built in a temp dir and merged into the committed files
# with scripts/ci/top100_coverage_merge.py (temp file + rename). Companies whose top100-flow job is running or queued keep
# their committed rows, because their database state is mid-reload (0.0% and 41% half states reached main on 2026-11-16).
# If GitHub cannot say what is in flight, nothing is committed (fail closed); the flow's publish job keeps rows fresh.
# OPT-IN: the hourly schedule only does anything when the repository variable TOP100_COVERAGE_HOURLY is "true"
# (Settings, Secrets and variables, Variables). A manual dispatch from main always runs.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  # GitHub drops scheduled runs under load (2026-11-16: only the 23:59Z slot ran between 00:17 and 04:17Z), so the
  # export also runs whenever a top-100 batch finishes: coverage is fresh after every batch whatever the cron does.
  workflow_run:
    workflows: ["Top-100 per-company flow (scripts/top100_flow.sh)"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: top100-coverage-hourly
  cancel-in-progress: false

jobs:
  export:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' || vars.TOP100_COVERAGE_HOURLY == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --project pipeline --locked
      - name: Rebuild the coverage export (read-only session)
        env:
          PGOPTIONS: "-c default_transaction_read_only=on -c statement_timeout=900000"
          PYTHONPATH: pipeline/src
        run: pipeline/.venv/bin/python pipeline/scripts/top100_coverage.py "$RUNNER_TEMP/cov"
      - name: Companies in flight (top100-flow jobs running or queued keep their committed rows)
        id: inflight
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -u
          if IDS=$(python3 -I scripts/ci/top100_inflight.py); then
            echo "in flight: '${IDS}'"; echo "ids=$IDS" >> "$GITHUB_OUTPUT"; echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::could not list in-flight flow jobs; this export is NOT committed (fail closed)"; echo "ok=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Merge the export into the committed files (atomic; in-flight companies kept)
        if: steps.inflight.outputs.ok == '1'
        env:
          KEEP: ${{ steps.inflight.outputs.ids }}
        run: python3 -I scripts/ci/top100_coverage_merge.py --from "$RUNNER_TEMP/cov" --into data-team/strategy --keep-ids "$KEEP" --summary-only
      # The full per-cell CSV is an artifact only (90 days); git gets the summary. Agents needing per-cell rows download
      # the newest artifact (gh run download) or read the per-company open-shown files under data-team/strategy/open-shown/.
      - uses: actions/upload-artifact@v4
        with:
          name: top100-coverage-${{ github.run_id }}
          path: ${{ runner.temp }}/cov/top100-coverage.csv
          retention-days: 90
      - name: Commit the changed files
        if: steps.inflight.outputs.ok == '1'
        env:
          KEEP: ${{ steps.inflight.outputs.ids }}
        run: |
          set -u
          files="data-team/strategy/top100-coverage-summary.csv"
          if [ -z "$(git status --porcelain -- $files)" ]; then
            echo "no change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            # re-merge onto the fresh main: a flow publish job may have landed another company's row meanwhile
            python3 -I scripts/ci/top100_coverage_merge.py --from "$RUNNER_TEMP/cov" --into data-team/strategy --keep-ids "$KEEP" --summary-only || { echo "::error::merge failed"; exit 1; }
            git add $files
            git diff --cached --quiet && { echo "no change against main"; exit 0; }
            git commit -q -m "Top-100 coverage export $(date -u +%Y%m%dT%H%MZ) (hourly workflow, read-only rebuild)"
            git push -q origin HEAD:main && { echo pushed; exit 0; }
            sleep $((RANDOM % 8 + 2))
          done
          echo "::error::push failed after retries"; exit 1
