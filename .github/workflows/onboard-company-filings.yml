name: Onboard companies, step 2 (filings into core and FSN, plus dimensional notes)

# Manual only. Playbook doc/playbook/COMPANY-ONBOARDING.md step 2. Input: tickers and/or CIKs, and `width`.
# Run onboard-company-identity.yml (step 1) first: this workflow needs core.company rows.
#   apply=false (default): writes NOTHING. Builds the missing filings from EDGAR (reads sec.gov), dry-runs the
#     authority and dedupe stages (rolled back), `fsn load --increment --dry-run`, and `add-dim-notes` without --apply.
#     The bootstrap and the four normalize stages have no dry run and are skipped (they are idempotent upserts).
#   apply=true: MAIN ONLY, PRODUCTION WRITE. In order: bootstrap companyfacts and submissions for the CIKs and the
#     predecessor source CIKs of their history rows (one job, bulk zips cached per day); then per shard:
#     normalize identity, periods, units and facts (--ciks is always set, so the normalizer's empty-list fallback is
#     never reached), tagmap-authority --apply, tagmap-dedupe --apply, `scrooner-fsn nightly` (the filings core.filing
#     holds and fsn.filing lacks, built from each filing's own XBRL on EDGAR) then `scrooner-fsn load --increment`,
#     then `scrooner-fsn add-dim-notes --apply` (insert-only).
# FSN part: the same two commands as pipeline-fsn-load-filings.yml (7a771185), run per shard. That workflow cannot be
# called from another (it is workflow_dispatch only) and this one needs the FSN part inside the shard job. Both work
# for a company OUTSIDE cohort v1.1: the candidates come from core.filing minus fsn.filing, not from the cohort
# bucket extracts that `pipeline-fsn-write.yml stage=load_map` refuses to go beyond.
# Idempotent and resumable per company: every stage upserts or is insert-only; `load --increment` only adds the
# accessions fsn.filing lacks; a shard that hits `max_minutes` defers the rest and reports it: rerun the same dispatch.
# Width: `width` shards (1 to 8), round-robin by CIK. SEC rate: only `fsn nightly` and the bootstrap fetch from SEC.
# Each runner holds at most 2 req/s (SEC_MAX_REQUESTS_PER_SECOND and SCROONER_EDGAR_MAX_RPS are both 2) and the limiter
# lock is per machine, so the shard matrix is capped at max-parallel 2 runners: 2 x 2 = 4 req/s, the repo ceiling.
# The bootstrap job runs before the shards, never beside them. Do not raise max-parallel without lowering the rate.
# Queue: manual-db-jobs. The guard (scripts/ci/heavy_job_guard.sh) lists this workflow as a heavy job and as an FSN
# write: the top-100 flow, refresh and sanity wait for it, and apply refuses to start beside another heavy job.
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers; optional if ciks is given"
        default: ""
      ciks:
        description: "Comma-separated CIKs (10 digits or fewer); optional if tickers is given"
        default: ""
      width:
        description: "Shards 1..8 (round-robin by CIK); at most 2 run at once (SEC budget)"
        default: "2"
      since:
        description: "Filings filed on or after YYYY-MM-DD (default = the whole history since 2014)"
        default: "2014-01-01"
      max_minutes:
        description: "Per shard fetch budget in minutes (at most 200); the rest is deferred and reported"
        default: "150"
      apply:
        description: "true = write (main only); false = read-only dry runs"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: manual-db-jobs
  cancel-in-progress: false

env:
  MAX_BACKENDS: "60"

jobs:
  wait-for-fsn-write:
    name: Wait while an FSN production write is in progress
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Refuse an apply from anything but a dispatch on main
        env:
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ] && { [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; }; then
            echo "::error::apply runs only from workflow_dispatch on main (ref $GITHUB_REF, event $GITHUB_EVENT_NAME)"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAVY_GUARD_SELF: onboard-company-filings.yml
        run: scripts/ci/heavy_job_guard.sh wait-for-write 330

  plan:
    name: Resolve the list and the shards
    needs: wait-for-fsn-write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      SCROONER_EDGAR_MAX_RPS: "2"
      SEC_MAX_REQUESTS_PER_SECOND: "2"
      TICKERS: ${{ inputs.tickers }}
      CIKS: ${{ inputs.ciks }}
      WIDTH: ${{ inputs.width }}
      SINCE: ${{ inputs.since }}
      MAX_MINUTES: ${{ inputs.max_minutes }}
      PYTHONPATH: pipeline/src
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      all_ciks: ${{ steps.shards.outputs.all_ciks }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate inputs
        run: |
          set -eu
          [ -n "$TICKERS$CIKS" ] || { echo "::error::give tickers or ciks"; exit 1; }
          printf '%s' "$TICKERS" | grep -Eq '^[A-Za-z0-9.,\ -]*$' || { echo "::error::tickers: letters, digits, dot, dash, comma"; exit 1; }
          printf '%s' "$CIKS" | grep -Eq '^[0-9,\ ]*$' || { echo "::error::ciks must be digits and commas"; exit 1; }
          printf '%s' "$WIDTH" | grep -Eq '^[1-8]$' || { echo "::error::width must be 1 to 8"; exit 1; }
          printf '%s' "$SINCE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "::error::since must be YYYY-MM-DD"; exit 1; }
          printf '%s' "$MAX_MINUTES" | grep -Eq '^[0-9]{1,3}$' || { echo "::error::max_minutes must be a number"; exit 1; }
          [ "$MAX_MINUTES" -le 200 ] || { echo "::error::max_minutes must be at most 200"; exit 1; }
      - name: No other heavy database job running or queued (apply only)
        if: ${{ inputs.apply }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAVY_GUARD_SELF: onboard-company-filings.yml
        run: scripts/ci/heavy_job_guard.sh refuse-if-heavy
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --project pipeline --locked
      - name: Resolve CIKs, check they exist in core.company, build the shards
        id: shards
        run: |
          set -eu
          resolved=$(uv run --project pipeline python -m scrooner_pipeline.onboarding.ciks resolve --tickers "$TICKERS" --ciks "$CIKS")
          ids=$(uv run --project pipeline python -m scrooner_pipeline.onboarding.ciks ids --ciks "$resolved")
          have=$(printf '%s' "$ids" | tr ',' '\n' | grep -c . || true)
          want=$(printf '%s' "$resolved" | tr ',' '\n' | grep -c .)
          echo "CIKs: $want; with a core.company row: $have"
          if [ "$have" -ne "$want" ]; then
            echo "::error::$((want - have)) CIK(s) have no core.company row; run onboard-company-identity.yml (apply=true) first"; exit 1
          fi
          expanded=$(uv run --project pipeline python -m scrooner_pipeline.onboarding.ciks expand --ciks "$resolved")
          echo "with predecessor source CIKs: $expanded"
          echo "all_ciks=$expanded" >> "$GITHUB_OUTPUT"
          echo "shards=$(uv run --project pipeline python -m scrooner_pipeline.onboarding.ciks shards --ciks "$resolved" --width "$WIDTH")" >> "$GITHUB_OUTPUT"

  bootstrap:
    name: Bootstrap companyfacts and submissions (apply only)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      SEC_MAX_REQUESTS_PER_SECOND: "2"
      SCROONER_EDGAR_MAX_RPS: "2"
      ALL_CIKS: ${{ needs.plan.outputs.all_ciks }}
    steps:
      - name: Dry run skips the bootstrap
        if: ${{ !inputs.apply }}
        run: |
          echo "dry run: bootstrap companyfacts/submissions skipped (raw.* writes); CIKs $ALL_CIKS"
      - uses: actions/checkout@v4
        if: ${{ inputs.apply }}
      - uses: astral-sh/setup-uv@v6
        if: ${{ inputs.apply }}
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: actions/setup-python@v5
        if: ${{ inputs.apply }}
        with:
          python-version: "3.12"
      - run: uv sync --project pipeline --locked
        if: ${{ inputs.apply }}
      - name: Bootstrap companyfacts (PRODUCTION WRITE to raw.*; resumes the same run if killed)
        if: ${{ inputs.apply }}
        run: uv run --project pipeline scrooner-bootstrap companyfacts --ciks "$ALL_CIKS"
      - name: Bootstrap submissions (PRODUCTION WRITE to raw.*)
        if: ${{ inputs.apply }}
        run: uv run --project pipeline scrooner-bootstrap submissions --ciks "$ALL_CIKS"

  process:
    name: Shard ${{ matrix.ciks }}
    needs: [plan, bootstrap]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      # SEC budget: each runner is <= 2 req/s, the limiter is per machine, so two at once is the 4 req/s ceiling
      max-parallel: 2
      matrix:
        ciks: ${{ fromJSON(needs.plan.outputs.shards) }}
    defaults:
      run:
        shell: bash
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      SCROONER_EDGAR_MAX_RPS: "2"
      SEC_MAX_REQUESTS_PER_SECOND: "2"
      SHARD_CIKS: ${{ matrix.ciks }}
      SINCE: ${{ inputs.since }}
      MAX_MINUTES: ${{ inputs.max_minutes }}
      PYTHONPATH: pipeline/src
    steps:
      - uses: actions/checkout@v4
      - name: Connection headroom
        run: |
          set -eu
          used=$(psql "$DATABASE_URL" -tAc "select count(*) from pg_stat_activity where backend_type = 'client backend'")
          echo "client backends now: $used; this shard holds at most 2 (2 shards at once)"
          if [ $((used + 4)) -gt "$MAX_BACKENDS" ]; then echo "::error::$used + 4 would exceed $MAX_BACKENDS of 90"; exit 1; fi
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --project pipeline --locked
      - name: This shard's CIKs, the predecessor source CIKs of their history rows, and company ids
        run: |
          set -eu
          mkdir -p out
          expanded=$(uv run --project pipeline python -m scrooner_pipeline.onboarding.ciks expand --ciks "$SHARD_CIKS")
          ids=$(uv run --project pipeline python -m scrooner_pipeline.onboarding.ciks ids --ciks "$SHARD_CIKS")
          [ -n "$ids" ] || { echo "::error::no core.company ids for $SHARD_CIKS"; exit 1; }
          echo "EXPANDED=$expanded" >> "$GITHUB_ENV"
          echo "IDS=$ids" >> "$GITHUB_ENV"
          echo "shard CIKs $SHARD_CIKS; with predecessors $expanded; company ids $ids"
      - name: Normalize identity, periods, units, facts (PRODUCTION WRITE to core.*; --ciks always set)
        if: ${{ inputs.apply }}
        run: |
          set -eu
          for stage in identity periods units facts; do
            echo "== normalize $stage"
            uv run --project pipeline scrooner-normalize "$stage" --ciks "$EXPANDED"
          done
      - name: Dry run note
        if: ${{ !inputs.apply }}
        run: |
          echo "dry run: normalize identity, periods, units, facts skipped (idempotent upserts, no dry-run mode)"
      - name: tagmap-authority
        run: |
          set -eu
          if [ "${{ inputs.apply }}" = "true" ]; then flag="--apply"; else flag=""; fi
          uv run --project pipeline scrooner-normalize tagmap-authority --company-ids "$IDS" $flag | tee out/tagmap-authority.txt
      - name: tagmap-dedupe
        run: |
          set -eu
          if [ "${{ inputs.apply }}" = "true" ]; then flag="--apply"; else flag=""; fi
          uv run --project pipeline scrooner-normalize tagmap-dedupe --company-ids "$IDS" $flag | tee out/tagmap-dedupe.txt
      - name: Build the missing filings from EDGAR (reads the database and sec.gov at <= 2 requests/s; local files only)
        run: |
          uv run --project pipeline scrooner-fsn nightly --out out/companies --ciks "$SHARD_CIKS" --since "$SINCE" \
            --max-minutes "$MAX_MINUTES" --report out/nightly.json
      - name: FSN load, dry run (read-only transaction)
        if: ${{ !inputs.apply }}
        run: |
          set -eu
          ciks=$(cat out/companies/ciks.txt 2>/dev/null || true)
          [ -n "$ciks" ] || { echo "no filing built"; exit 0; }
          uv run --project pipeline scrooner-fsn load --companies out/companies --ciks "$ciks" --increment --dry-run --report out/load-plan.json
      - name: FSN load (PRODUCTION WRITE to fsn.*, increment of those accessions only)
        if: ${{ inputs.apply }}
        run: |
          set -eu
          ciks=$(cat out/companies/ciks.txt 2>/dev/null || true)
          [ -n "$ciks" ] || { echo "no filing built"; exit 0; }
          uv run --project pipeline scrooner-fsn load --companies out/companies --ciks "$ciks" --increment --report out/load.json
      - name: add-dim-notes (insert-only into fsn.value when --apply; dry run otherwise)
        run: |
          set -eu
          if [ "${{ inputs.apply }}" = "true" ]; then flag="--apply"; else flag=""; fi
          uv run --project pipeline scrooner-fsn add-dim-notes --company-ids "$IDS" $flag --report out/dim-notes.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onboard-filings-${{ github.run_id }}-${{ strategy.job-index }}
          path: |
            out/*.json
            out/*.txt
          if-no-files-found: ignore
          retention-days: 30
