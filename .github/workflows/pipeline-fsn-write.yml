name: FSN store production write (cohort)

# Manual only. PRODUCTION WRITE: dispatch only on the founder's typed go-ahead (scrooner-87 session).
# For the v1.1 cohort, sharded by company (company_id % shards: a company is in exactly one shard, so two
# writers never touch one company's rows), one transaction per company:
#   stage load_map:     shard from the bucket -> load fsn.* (filing, report, tag, dim, line, value, calc_arc,
#                       company_load) -> map fsn.line_map (the library) and fsn.filing_check
#   stage select_write: (also runs load_map) -> select -> before-image of the shard's canonical_fact and
#                       cell_blank_reason (uploaded BEFORE the write) -> done gate (ruling
#                       RULING-DONE-GATE-C4-2026-11-09 with the founder's no-fallback decision 2026-11-09:
#                       criteria 1/2/5 per company; every listed in-template pair of a passing company is written
#                       whole, a gap key as a reasoned blank; C2 is a report, valued_to_blank.json) ->
#                       `scrooner-cells load --apply` for the done pairs (design §7.6). The
#                       cell_proof scope is out/written_companies.txt (every company with a written pair, C4).
#                       dividends_per_share (C6), total debt and total liabilities (C8) stay out.
#                       Every written key is protected (analytics.slot_protected_cell, 0113), so the nightly
#                       mapper, conflict fill and derivation cannot overwrite it; other families keep refreshing.
#   stage select_plan:  the whole select_write path against production (shard, load and map, pilot, pilot-prod
#                       before-image, done gate, write filter), but `scrooner-cells load --plan`: every company's
#                       transaction is rolled back, so it writes NO analytics.canonical_fact, cell_blank_reason or
#                       slot_protected_cell row (the loader records one dry_run analytics.rule_run row per family
#                       file). load/map still WRITE fsn.* (the store and the library: fsn.filing ... line_map,
#                       filing_check) and the seed job writes fsn.concept_rule, exactly as load_map does, under the
#                       founder's store-load approval. Uploads the C2 table (valued_to_no_row.tsv,
#                       valued_to_blank.json), not_done.json, done_pairs.tsv, done_companies.txt, the plan reports
#                       (write-*.json) and the before-image. Same window, headroom and shard rules; no CIK list.
#   stage proof_blank:  (N2, no fallback) from the select_write run proof_run: per shard, `scrooner-fsn proof-blank`
#                       (read-only) turns each written cell that analytics.cell_proof DISAGREEs with into a defect
#                       blank (whole pairs); prints the summary; plan by default, `--apply` only with apply=true,
#                       after a before-image of the affected companies (fsn-proofblank-before-image-<i>, restore
#                       format) is uploaded. Same shards/limit inputs as the write run; no CIK list.
#   stage restore:      put the before-image of restore_run back for restore_company_ids (criterion 6: a
#                       company with a served cell_proof DISAGREE after the write is restored)
# Concept rules are seeded once (seed job) from data-team/47-fsn-store/concept_rules. Debt, balance-sheet,
# capex and D&A cells stay out until the release approver clears them (data_points input). Connections: at
# most 2 per shard, preflight at start and a re-check before every company (pause while client backends
# exceed 60); never inside the nightly refresh window.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "load_map (fsn.* + library), select_plan (select_write rolled back: no canonical_fact write), select_write (also writes canonical_fact), proof_blank (N2: re-write cell_proof DISAGREEs as defect blanks) or restore"
        type: choice
        options: [load_map, select_plan, select_write, proof_blank, restore]
        default: load_map
      shards:
        description: "Shards, 1..20 (each holds at most 2 production connections: budget 40)"
        default: "16"
      limit:
        description: "Only the first N cohort companies (rank order); empty = all 1,000"
        default: ""
      ciks:
        description: "load_map only: comma-separated CIKs (all in cohort v1.1) instead of cohort/limit; empty = the cohort"
        default: ""
      data_points:
        description: "Data points the cell write may touch (passed families)"
        default: "revenue_sanity_resolved,net_income_resolved,operating_income_resolved,gross_profit_resolved,cost_of_revenue_resolved,income_before_tax_resolved,income_tax_expense_resolved,interest_expense_resolved,cfo_resolved,share_buybacks_resolved,dividends_paid_resolved,basic_eps_resolved,diluted_eps_resolved"
      proof_run:
        description: "proof_blank only: the select_write run id whose out/write cells are checked (same shards and limit)"
        default: ""
      apply:
        description: "proof_blank only: true = load the defect blanks (--apply, production write); false = --plan"
        type: boolean
        default: false
      restore_run:
        description: "restore only: the select_write run id whose before-images to put back"
        default: ""
      restore_company_ids:
        description: "restore only: comma-separated company ids"
        default: ""
      code_ref:
        description: "Git ref holding the store code"
        default: "main"

permissions:
  contents: read
  actions: read

# Own queue: it must not wait behind (or block) a running manual proof run; the headroom
# preflight and the per-company re-check keep the two inside the connection budget.
concurrency:
  group: fsn-write
  cancel-in-progress: false

env:
  COHORT_CSV: data-team/strategy/data/cohort_v1_1_proposal_2026-10-24.csv
  MAX_BACKENDS: "60"

jobs:
  seed:
    name: Preflight and seed concept rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      shards: ${{ steps.s.outputs.shards }}
      ciks_sha256: ${{ steps.s.outputs.ciks_sha256 }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      SHARDS: ${{ inputs.shards }}
      LIMIT: ${{ inputs.limit }}
      CIKS_LIST: ${{ inputs.ciks }}
      STAGE: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.code_ref }}
      - name: Shard plan (before any database connection; a CIK list must be in cohort v1.1 and needs load_map)
        id: s
        run: python3 pipeline/scripts/fsn_write_shards.py "$COHORT_CSV" "$STAGE" "$SHARDS" "$LIMIT" "$CIKS_LIST" >> "$GITHUB_OUTPUT"
      - name: Outside the nightly window, connection headroom
        run: |
          set -eu
          now=$(date -u +%H%M)
          if [ "$now" -ge 1800 ] && [ "$now" -lt 2130 ]; then echo "::error::inside the 18:00-21:30 UTC nightly window"; exit 1; fi
          case "$SHARDS" in ''|*[!0-9]*) echo "::error::shards must be a number"; exit 1;; esac
          if [ "$SHARDS" -lt 1 ] || [ "$SHARDS" -gt 20 ]; then echo "::error::shards must be 1..20"; exit 1; fi
          used=$(psql "$DATABASE_URL" -tAc "select count(*) from pg_stat_activity where backend_type = 'client backend'")
          echo "client backends now: $used; this run adds up to $((SHARDS * 2))"
          if [ $((used + SHARDS * 2)) -gt "$MAX_BACKENDS" ]; then echo "::error::$used + $((SHARDS * 2)) would exceed $MAX_BACKENDS of 90"; exit 1; fi
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --project pipeline --locked
      - name: Seed concept rules (production fsn.concept_rule)
        if: inputs.stage != 'restore' && inputs.stage != 'proof_blank'
        run: uv run --project pipeline scrooner-fsn seed-rules $(ls data-team/47-fsn-store/concept_rules/*.jsonl | grep -v _provenance) --apply

  write:
    name: write shard ${{ matrix.shard.i }}
    needs: seed
    if: inputs.stage != 'restore' && inputs.stage != 'proof_blank'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.seed.outputs.shards) }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      CIKS: ${{ matrix.shard.ciks }}
      STAGE: ${{ inputs.stage }}
      DATA_POINTS: ${{ inputs.data_points }}
      CIKS_SHA256: ${{ needs.seed.outputs.ciks_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.code_ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --project pipeline --locked
      - name: Shard from the fsn-notes bucket (reads production core.company and history sources)
        run: uv run --project pipeline scrooner-fsn shard --ciks "$CIKS" --out companies --cache .cache/fsn-shard --floor-gb 3
      - name: Load fsn.* (production, one transaction per company, idempotent on input sha + loader commit)
        run: |
          mkdir -p out
          uv run --project pipeline scrooner-fsn load --companies companies --report out/load.json --input-sha "$CIKS_SHA256"
      - name: Map (fsn.line_map), checks (fsn.filing_check), select, report (production fsn.* writes)
        # interest-expense note values cleared by the Verifier draw 2026-11-03 (Ritwik); operating income
        # is never note-sourced (select.NOTE_TAGS)
        run: uv run --project pipeline scrooner-fsn pilot --ciks "$CIKS" --out out
      - name: Before-image of canonical_fact and reasons (read)
        if: inputs.stage == 'select_write' || inputs.stage == 'select_plan'
        run: |
          uv run --project pipeline scrooner-fsn pilot-prod --pilot-out out
          python3 -c "import json; print('\n'.join(str(r['company_id']) for r in json.load(open('out/report.json'))))" > out/before_image/companies.txt
          echo "$DATA_POINTS" > out/before_image/data_points.txt
      - name: Store the before-image before any write
        if: inputs.stage == 'select_write' || inputs.stage == 'select_plan'
        uses: actions/upload-artifact@v4
        with:
          name: fsn-write-before-image-${{ matrix.shard.i }}
          path: out/before_image/
          if-no-files-found: error
          retention-days: 90
      - name: Done gate (criteria 1/2/5 per company; pairs written whole, gaps as reasoned blanks; C2 report; read)
        if: inputs.stage == 'select_write' || inputs.stage == 'select_plan'
        run: uv run --project pipeline scrooner-fsn done-gate --pilot-out out --data-points "$DATA_POINTS"
      - name: Write the done (company, data point) pairs to canonical_fact
        if: inputs.stage == 'select_write'
        run: |
          set -u
          for d in out/cells/*/; do
            # no cells at all (every company failed): the unmatched glob must not crash the step
            [ -f "$d/cells.jsonl.gz" ] || continue
            fam=$(basename "$d")
            [ "$fam" = "unowned" ] && continue
            mkdir -p "out/write/$fam"
            python3 pipeline/scripts/fsn_write_filter.py "$d/cells.jsonl.gz" "out/write/$fam/cells.jsonl.gz" "$DATA_POINTS" out/done_pairs.tsv
            if [ "$(zcat "out/write/$fam/cells.jsonl.gz" | wc -l)" -eq 0 ]; then continue; fi
            uv run --project pipeline scrooner-cells load "out/write/$fam/cells.jsonl.gz" --family "$fam" --apply \
              --max-backends "$MAX_BACKENDS" --statement-timeout 10min --protect \
              --report "out/write-$fam.json" || echo "::warning::cell write $fam failed"
          done
      - name: Plan the done (company, data point) pairs (select_plan; every company rolled back, nothing written)
        if: inputs.stage == 'select_plan'
        run: |
          set -u
          for d in out/cells/*/; do
            [ -f "$d/cells.jsonl.gz" ] || continue
            fam=$(basename "$d")
            [ "$fam" = "unowned" ] && continue
            mkdir -p "out/write/$fam"
            python3 pipeline/scripts/fsn_write_filter.py "$d/cells.jsonl.gz" "out/write/$fam/cells.jsonl.gz" "$DATA_POINTS" out/done_pairs.tsv
            if [ "$(zcat "out/write/$fam/cells.jsonl.gz" | wc -l)" -eq 0 ]; then continue; fi
            uv run --project pipeline scrooner-cells load "out/write/$fam/cells.jsonl.gz" --family "$fam" --plan \
              --max-backends "$MAX_BACKENDS" --statement-timeout 10min --protect \
              --report "out/write-$fam.json" || echo "::warning::cell plan $fam failed"
          done
      - name: Shard outcome (red when the shard had companies and no company report; warn on failures)
        if: always()
        run: python3 pipeline/scripts/fsn_shard_outcome.py out "$CIKS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fsn-write-shard-${{ matrix.shard.i }}
          path: |
            out/report.json
            out/failed.json
            out/gaps.csv
            out/library.csv
            out/load.json
            out/summary.md
            out/done_companies.txt
            out/done_pairs.tsv
            out/written_companies.txt
            out/valued_to_blank.json
            out/valued_to_no_row.tsv
            out/not_done.json
            out/missing_filings.json
            out/write-*.json
            out/write/
          if-no-files-found: ignore

  proof_blank:
    name: proof_blank shard ${{ matrix.shard.i }}
    needs: seed
    if: inputs.stage == 'proof_blank'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.seed.outputs.shards) }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      SHARD: ${{ matrix.shard.i }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.code_ref }}
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --project pipeline --locked
      - name: Download the write run's shard artifact (out/write/)
        uses: actions/download-artifact@v4
        with:
          name: fsn-write-shard-${{ matrix.shard.i }}
          path: written
          run-id: ${{ inputs.proof_run }}
          github-token: ${{ github.token }}
      - name: Proof-blank (read-only on production), DISAGREEs of written cells become defect blanks, whole pairs
        run: |
          set -eu
          [ -d written/write ] || { echo "::warning::shard $SHARD wrote no cells (no out/write): nothing to check"; exit 0; }
          uv run --project pipeline scrooner-fsn proof-blank --write-dir written/write --out out/proof_blank | tee out/proof_blank.log
          python3 - <<'PY'
          import json
          s = json.load(open("out/proof_blank/summary.json"))
          print("pairs re-written (rows reloaded, cells blanked) per family:", json.dumps(s["families"]))
          print("DISAGREE rows on the written companies:", s["disagree_rows"])
          print("DISAGREEs matching no written cell:", s["disagree_not_in_written_cells"])
          PY
      - name: Before-image of the affected companies (read-only export, restore format)
        run: |
          set -eu
          mkdir -p out
          uv run --project pipeline python pipeline/scripts/proof_blank_before_image.py out/proof_blank out/before_image
      - name: Store the before-image before any load
        uses: actions/upload-artifact@v4
        with:
          name: fsn-proofblank-before-image-${{ matrix.shard.i }}
          path: out/before_image/
          if-no-files-found: ignore
          retention-days: 90
      - name: Plan the defect blanks (every company rolled back, nothing written)
        if: ${{ !inputs.apply }}
        run: |
          set -u
          for d in out/proof_blank/*/; do
            [ -f "$d/cells.jsonl.gz" ] || continue
            fam=$(basename "$d")
            uv run --project pipeline scrooner-cells load "$d/cells.jsonl.gz" --family "$fam" --plan --protect \
              --max-backends "$MAX_BACKENDS" --statement-timeout 10min \
              --report "out/proof_blank-$fam.json" || echo "::warning::proof_blank plan $fam failed"
          done
      - name: Load the defect blanks (PRODUCTION WRITE, only with apply=true)
        if: ${{ inputs.apply }}
        run: |
          set -u
          for d in out/proof_blank/*/; do
            [ -f "$d/cells.jsonl.gz" ] || continue
            fam=$(basename "$d")
            uv run --project pipeline scrooner-cells load "$d/cells.jsonl.gz" --family "$fam" --apply --protect \
              --max-backends "$MAX_BACKENDS" --statement-timeout 10min \
              --report "out/proof_blank-$fam.json" || echo "::warning::proof_blank load $fam failed"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fsn-proofblank-shard-${{ matrix.shard.i }}
          path: |
            out/proof_blank/
            out/proof_blank.log
            out/proof_blank-*.json
          if-no-files-found: ignore

  restore:
    name: Restore before-images
    needs: seed
    if: inputs.stage == 'restore'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # the pipeline's Settings require all four, as in the other jobs (restore run 42966152108 failed without them)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      RESTORE_IDS: ${{ inputs.restore_company_ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.code_ref }}
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --project pipeline --locked
      - uses: actions/download-artifact@v4
        with:
          pattern: fsn-write-before-image-*
          path: before
          run-id: ${{ inputs.restore_run }}
          github-token: ${{ github.token }}
      - name: Restore (each company from the shard whose before-image holds it)
        run: |
          set -eu
          [ -n "$RESTORE_IDS" ] || { echo "::error::restore_company_ids is empty"; exit 1; }
          missing=$(python3 -c "import glob, sys; want=set(sys.argv[1].split(',')); have=set(); [have.update(open(p).read().split()) for p in glob.glob('before/*/companies.txt')]; print(','.join(sorted(want - have)))" "$RESTORE_IDS")
          [ -z "$missing" ] || { echo "::error::no before-image holds company ids $missing"; exit 1; }
          for d in before/*/; do
            ids=$(python3 -c "import sys; want=set(sys.argv[1].split(',')); have=set(open(sys.argv[2]).read().split()); print(','.join(sorted(want & have)))" "$RESTORE_IDS" "$d/companies.txt")
            [ -z "$ids" ] && continue
            uv run --project pipeline scrooner-cells restore --before-image "$d" --company-ids "$ids" \
              --data-points "$(cat "$d/data_points.txt")" --apply
          done
