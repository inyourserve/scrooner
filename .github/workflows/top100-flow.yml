name: Top-100 per-company flow (scripts/top100_flow.sh)

# Manual only (a schedule is deliberately NOT enabled: every run WRITES production data: docmap-load, structural-load,
# tagmap-plan --apply, proof --write, era-guard, certified-guard restore). The founder dispatches it.
# One matrix job per company runs scripts/top100_flow.sh with TOP100_CI=1 (the single source of the chain; CI mode only
# swaps the Mac worktree/venv/.env plumbing for the runner checkout). Each job uploads its run folder (before-images
# bi_a/bi_b, proof jsonl, coverage CSVs, regressions). The aggregate job joins the per-company result lines into a job
# summary + artifact. It never commits to main.
# Company list: `company_ids` (comma-separated core.company ids) OR, if empty, `csv_path` (column company_id).
# run_label (2026-11-22, canary releases): top100-auto-trigger names its canary run so it can find that run and wait for
# it; empty keeps the default title. It changes nothing in the chain.
run-name: ${{ inputs.run_label != '' && inputs.run_label || 'Top-100 per-company flow' }}
on:
  workflow_dispatch:
    inputs:
      company_ids:
        description: "Comma-separated core.company ids (e.g. 2733,3,1204). Empty = read csv_path"
        default: ""
      csv_path:
        description: "Repo CSV with a company_id column, used when company_ids is empty"
        default: "data-team/strategy/top100-coverage-summary.csv"
      only_open:
        description: "With csv_path: only rows where pct_proven_plus_reason < 100"
        type: boolean
        default: true
      parallel:
        description: "Companies at once, 1..20 (jobs also wait while pg_stat_activity > 80; data loads stay within 70)"
        default: "16"
      run_label:
        description: "Run title (top100-auto-trigger sets 'canary <sha> <run id>' for its canary run). Empty = default"
        default: ""

permissions:
  contents: read
  actions: read

# Same queue as the other manual DB jobs: never beside the nightly refresh or another manual heavy run.
concurrency:
  group: manual-db-jobs
  cancel-in-progress: false

jobs:
  wait-for-fsn-write:
    name: Wait while an FSN production write is in progress
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      # secrets and production writes only from main via workflow_dispatch (never a fork PR, never another branch)
      - name: Refuse anything but a dispatch on main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::production flow runs only from workflow_dispatch on main (ref $GITHUB_REF, event $GITHUB_EVENT_NAME)"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: scripts/ci
      - env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/heavy_job_guard.sh wait-for-write 330

  plan:
    needs: wait-for-fsn-write
    name: Resolve company list
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      count: ${{ steps.m.outputs.count }}
    env:
      IDS_INPUT: ${{ inputs.company_ids }}
      CSV_PATH: ${{ inputs.csv_path }}
      ONLY_OPEN: ${{ inputs.only_open }}
      PARALLEL: ${{ inputs.parallel }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: m
        run: |
          set -eu
          case "$PARALLEL" in ''|*[!0-9]*) echo "::error::parallel must be a number"; exit 1;; esac
          if [ "$PARALLEL" -lt 1 ] || [ "$PARALLEL" -gt 20 ]; then echo "::error::parallel must be 1..20"; exit 1; fi
          python3 - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import csv, json, os, re, sys
          ids = os.environ["IDS_INPUT"].strip()
          if ids:
              if not re.fullmatch(r"[0-9]+(,[0-9]+)*", ids):
                  sys.exit("company_ids must match ^[0-9]+(,[0-9]+)*$")
              lst = ids.split(",")
          else:
              p = os.environ["CSV_PATH"]
              if not re.fullmatch(r"[A-Za-z0-9_./-]+", p) or ".." in p or not os.path.isfile(p):
                  sys.exit(f"csv_path not a repo file: {p}")
              lst = []
              for r in csv.DictReader(open(p)):
                  pct = r.get("pct_proven_plus_reason")
                  if os.environ["ONLY_OPEN"] == "true" and pct not in (None, "") and float(pct) >= 100:
                      continue
                  lst.append(r["company_id"].strip())
          lst = list(dict.fromkeys(lst))
          if not lst or len(lst) > 256 or not all(x.isdigit() for x in lst):
              sys.exit(f"bad company list ({len(lst)})")
          print("matrix=" + json.dumps({"include": [{"id": x} for x in lst]}))
          print("count=" + str(len(lst)))
          PYEOF

  flow:
    name: company ${{ matrix.id }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      TOP100_CI: "1"
      CID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure zsh and zstd (the flow script is zsh; proof refuses to run without zstd)
        run: |
          if ! command -v zsh >/dev/null || ! command -v zstd >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq zsh zstd
          fi
      - run: uv sync --project pipeline --locked
      - name: Run the chain (connection preflight is inside the script and waits while pg_stat_activity > 80)
        run: |
          echo "code: $(git rev-parse HEAD)"
          zsh scripts/top100_flow.sh "$CID" "c$CID"
      - name: Open-shown cells of this company (published whether the gate passes or fails)
        if: always()
        run: |
          O=".runs/top100_flow/run_c$CID"
          CV="$O/coverage"; [ -d "$O/coverage_held" ] && CV="$O/coverage_held"
          python3 -I scripts/ci/top100_open_shown.py "$CV" "$CID" ".runs/top100_flow/publish_c$CID" || echo "no open-shown file produced (nothing will be published or deleted)"
      - name: Gate (display column of top100_coverage decides; SKIP until that column exists; nothing is sent early)
        # Reads only this run's coverage CSV (no DB). Writes .runs/top100_flow/publish_c<id>/ with gate.json and, on PASS,
        # the certification csv + request md. A FAIL or SKIP does not fail the job: it is a result, shown in the summary.
        run: |
          set -u
          O=".runs/top100_flow/run_c$CID"
          CV="$O/coverage"; [ -d "$O/coverage_held" ] && CV="$O/coverage_held"
          OUT=".runs/top100_flow/publish_c$CID"; mkdir -p "$OUT"
          TAB=$(printf '\t')
          LINE=$(grep "$TAB$CID$TAB" .runs/top100_flow/flow_results.tsv | tail -1 || true)
          case "$LINE" in
            *HELD_CERTIFIED*|*RESTORE_FAILED*|*REPROOF_FAILED*|*GUARD_ERROR*|"")
              echo "gate not run: flow line is '$LINE'"; echo '{"decision":"SKIP","reason":"flow line not clean"}' > "$OUT/gate.json"; exit 0;;
          esac
          [ -f "$CV/top100-coverage.csv" ] || { echo "gate not run: no coverage csv"; echo '{"decision":"SKIP","reason":"no coverage csv"}' > "$OUT/gate.json"; exit 0; }
          RES=data-team/tags/line_map/resolver; [ -d "$RES" ] || RES=$(ls data-team/tags/line_map/resolver-all110-*.csv 2>/dev/null | sort | tail -1 || true)
          TOK=$(printf '%s' "$LINE" | grep -oE 'RECERT_TOKEN=[^ ]+' | head -1 | cut -d= -f2 || true)
          python3 -I scripts/ci/top100_gate.py --coverage-csv "$CV/top100-coverage.csv" --company-id "$CID" \
            --out-dir "$OUT" --resolver "$RES" ${TOK:+--recert-token "$TOK"} || echo "gate exit $? (1 FAIL, 3 SKIP, 2 error): nothing sent"
      - name: Record a result line if the chain died before its own
        if: always()
        run: |
          mkdir -p .runs/top100_flow
          if ! grep -q "$(printf '\t')$CID$(printf '\t')" .runs/top100_flow/flow_results.tsv 2>/dev/null; then
            printf '%s\t%s\tNO_RESULT_LINE (chain exited early; see artifact logs)\n' "$(date -u +%H:%MZ)" "$CID" >> .runs/top100_flow/flow_results.tsv
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-${{ matrix.id }}
          include-hidden-files: true
          path: |
            .runs/top100_flow/run_c${{ matrix.id }}/
            .runs/top100_flow/regressions/
            .runs/top100_flow/publish_c${{ matrix.id }}/
            .runs/top100_flow/flow_results.tsv
          if-no-files-found: ignore

  publish:
    # Least privilege: only this job holds contents: write, and it holds no DB secret and runs no chain code.
    # It commits the gate's files (named paths only) for companies whose gate said PASS.
    name: publish ${{ matrix.id }}
    needs: [plan, flow]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CID: ${{ matrix.id }}
    steps:
      - name: Refuse anything but a dispatch on main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::publish runs only from workflow_dispatch on main"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: flow-${{ matrix.id }}
          path: part
      - name: Commit open-shown cells (pass or fail; file removed when 0 OPEN)
        run: |
          set -u
          J=$(find part -name open-shown.json -path "*publish_c$CID/*" | head -1 || true)
          if [ -z "$J" ]; then echo "no open-shown.json (chain produced no export): leaving open-shown/ untouched"; exit 0; fi
          D=$(dirname "$J")
          read -r TK N < <(python3 -I -c "import json,sys; d=json.load(open(sys.argv[1])); print(d['ticker'], d['open'])" "$J")
          case "$TK" in *[!A-Za-z0-9.-]*|"") echo "::error::bad ticker '$TK'"; exit 1;; esac
          F="data-team/strategy/open-shown/$TK.csv"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$N" -gt 0 ]; then
            mkdir -p data-team/strategy/open-shown
            cp "$D/open-shown.csv" "$F"
            git add "$F"
          elif [ -f "$F" ]; then
            git rm -q "$F"
          else
            echo "$TK: 0 OPEN and no file: nothing to do"; exit 0
          fi
          if git diff --cached --quiet; then echo "$TK: open-shown unchanged"; exit 0; fi
          git commit -q -m "Open shown cells for $TK: $N (top100-flow run $GITHUB_RUN_ID)"
          for i in $(seq 1 30); do
            git fetch -q origin main && git rebase -q origin/main && git push -q origin HEAD:main && { echo pushed; exit 0; }
            sleep $((RANDOM % 20 + 3))
          done
          echo "::error::push failed after retries"; exit 1
      - name: Commit this company's coverage rows (summary row always; the flow exports only its own company)
        # The chain's export holds ONE company (--company-ids). scripts/ci/top100_coverage_merge.py replaces that
        # company's rows in the committed files and writes them atomically; every other company's rows stay. Up to 16
        # publish jobs edit the same file, so a rebase could conflict: instead reset to origin/main and re-merge on each
        # retry (idempotent). Summary row on every run; the 9 MB full CSV only daily (founder-approved slimming,
        # 2026-11-16), so --summary-only here and the hourly export's 00:17Z run carries the full file.
        run: |
          set -u
          CV=$(find part -type d -path "*run_c$CID/coverage_held" | head -1 || true)
          [ -n "$CV" ] || CV=$(find part -type d -path "*run_c$CID/coverage" | head -1 || true)
          if [ -z "$CV" ] || [ ! -f "$CV/top100-coverage-summary.csv" ]; then echo "no coverage export in the artifact: nothing to merge"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 30); do
            git fetch -q origin main && git reset -q --hard origin/main || { sleep $((RANDOM % 20 + 3)); continue; }
            python3 -I scripts/ci/top100_coverage_merge.py --from "$CV" --into data-team/strategy --company-ids "$CID" --summary-only || { echo "::error::merge failed"; exit 1; }
            git add data-team/strategy/top100-coverage-summary.csv
            git diff --cached --quiet && { echo "coverage summary row for $CID unchanged"; exit 0; }
            git commit -q -m "Coverage row for company $CID (top100-flow run $GITHUB_RUN_ID)"
            git push -q origin HEAD:main && { echo pushed; exit 0; }
            sleep $((RANDOM % 20 + 3))
          done
          echo "::error::push failed after retries"; exit 1
      - name: Commit certification files on PASS
        run: |
          set -u
          G=$(find part -name gate.json -path "*publish_c$CID/*" | head -1 || true)
          if [ -z "$G" ]; then echo "no gate.json (flow job produced no artifact): nothing to publish"; exit 0; fi
          DEC=$(python3 -I -c "import json,sys; print(json.load(open(sys.argv[1]))['decision'])" "$G")
          echo "gate decision for $CID: $DEC"
          [ "$DEC" = PASS ] || exit 0
          D=$(dirname "$G")
          mkdir -p data-team/strategy/certification data-team/strategy/approvals/requests
          cp "$D"/*-coverage-*.csv data-team/strategy/certification/
          cp "$D"/*-request-*.md data-team/strategy/approvals/requests/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-team/strategy/certification/*-coverage-*.csv data-team/strategy/approvals/requests/*-request-*.md
          git commit -q -m "Certification request from top100-flow: company $CID passed the display gate ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          # up to 16 jobs push at once; only new files are added, so a rebase never conflicts
          for i in $(seq 1 30); do
            git fetch -q origin main && git rebase -q origin/main && git push -q origin HEAD:main && { echo pushed; exit 0; }
            sleep $((RANDOM % 20 + 3))
          done
          echo "::error::push failed after retries"; exit 1

  aggregate:
    name: Aggregate result lines
    needs: [plan, flow, publish]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: flow-*
          path: parts
      - name: Summarize (no commit to main)
        run: |
          mkdir -p summary
          find parts -name flow_results.tsv -exec cat {} + | sort -t "$(printf '\t')" -k2,2n -u > summary/body.tsv || true
          { printf 'time\tcompany_id\tticker cells pct gate (GATE_READY or NOT_GATE_READY) [VERIFIER_CERTIFIED] [HELD]\n'; cat summary/body.tsv; } > summary/flow_results.tsv
          {
            echo "### Top-100 flow results ($(wc -l < summary/body.tsv) of ${{ needs.plan.outputs.count }} companies)"
            echo '```'; cat summary/flow_results.tsv; echo '```'
            echo "GATE_READY: $(grep -c ' GATE_READY' summary/body.tsv || true); VERIFIER_CERTIFIED: $(grep -c VERIFIER_CERTIFIED summary/body.tsv || true); HELD_CERTIFIED: $(grep -c HELD_CERTIFIED summary/body.tsv || true); NO_RESULT_LINE: $(grep -c NO_RESULT_LINE summary/body.tsv || true)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: flow-summary
          path: summary/
