name: Pipeline freshness refresh

on:
  workflow_dispatch:
  schedule:
    # Non-top-of-hour scheduling reduces GitHub Actions congestion. The job
    # discovers the latest finalized SEC index, so weekends remain idempotent.
    - cron: "23 12 * * *"

permissions:
  contents: read

concurrency:
  group: pipeline-freshness-production
  cancel-in-progress: false

jobs:
  filing-index:
    name: SEC filing index and operational gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require production configuration
        run: |
          test -n "$DATABASE_URL"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SEC_USER_AGENT"
      - name: Install locked dependencies
        run: uv sync --project pipeline --locked
      - name: Index latest finalized SEC filing day
        run: uv run --project pipeline scrooner-incremental
      - name: Reprocess Normalizer + Mapper for recently-filed companies
        # Added 2026-09-09 -- closes a real, confirmed gap: scrooner-incremental
        # above only ever wrote new filing metadata/companyfacts/submissions
        # into `raw`. Nothing downstream ever reran the Normalizer's
        # derive-interim-quarters/derive-q4 or the Mapper's resolve/calculate
        # chain for those companies, so a company's core/analytics data could
        # go stale forever after its first full-population pass -- found live
        # from a real user report (Etsy showing blank quarterly revenue;
        # traced to the last full-population derive/resolve/calculate run
        # being 2+ weeks stale). Scoped to companies with a raw filing in the
        # last 10 days (see the script's own docstring for why raw, not
        # core.filing) -- cheap daily, not a full-population rerun.
        if: always()
        run: pipeline/scripts/reprocess_recent_filers.sh
      - name: Classify newly-ambiguous multi-listing companies (OpenFIGI)
        # Added 2026-09-20 -- closes a real, confirmed gap: core.listing.
        # security_type classification (company_master/security_type.py,
        # what resolve_primary_tickers() needs to pick a company's real
        # ticker out of several listings) had NEVER been wired into any
        # scheduled cron -- it only ran once, manually, on 2026-08-06.
        # Found live investigating a direct report that "lots of
        # companies don't have a ticker" in the daily sanity/yfinance-
        # financials logs: real operating companies (Equitable Holdings,
        # Triton International among them) sat permanently unresolvable
        # simply because they'd gained a second listing (a new preferred-
        # share/warrant registration, a SPAC merger completing) since the
        # one-time run and nothing ever reclassified them. Cheap and safe
        # to run daily: scoped to only companies with NO currently-
        # resolvable primary listing (~50, not the ~900 multi-listing
        # companies overall -- see the script's own docstring for the
        # earlier, over-broad version this replaced), ~8 minutes at
        # OpenFIGI's real rate limit. First run cut the stuck population
        # from 60 to 35 companies; most of the remainder are SPAC shells/
        # trusts/wholly-owned subsidiaries genuinely without a common
        # stock ticker, plus a handful (Webster Financial, CHS Inc,
        # Liberty Broadband, Aspen Insurance) where OpenFIGI's free-tier
        # ticker search itself has no match under any US exchange code --
        # confirmed live (AAPL resolves fine, WBS returns "No identifier
        # found" under exchCode=US/UN/UQ/UA/UW/UD/UF/UV and micCode=XNYS
        # alike) -- a real third-party data-coverage gap, not something
        # rerunning this job fixes.
        if: always()
        run: pipeline/scripts/classify_multi_listing_companies.sh
      - name: Persist primary_ticker onto core.company
        # Added 2026-09-20, direct user request: a real, queryable
        # "does this company have a ticker" marker on core.company itself
        # (migration 0069: primary_ticker/primary_ticker_status), instead
        # of every consumer (sanity/yfinance_check.py, yfinance_financials/
        # fetch.py, yfinance_industry.py) independently recomputing the
        # same core.listing query on every single run. Pure local
        # computation (no external fetch, ~9s for the full active
        # population) -- always runs right after the OpenFIGI
        # classification step above so it reflects today's freshly-
        # classified state, not yesterday's.
        if: always()
        run: uv run --project pipeline scrooner-company-master update-primary-ticker --all-active
      - name: Refresh real market prices (Alpaca)
        # Added 2026-09-08 -- doc 25's own docstring had flagged this as
        # "no scheduler wired up yet" since 2026-08-17. core.market_price_
        # alpaca had NEVER been refreshed by any automated process, which
        # is why the freshness gate below alerted on it every single day
        # with no way to ever clear. AlpacaClient.latest_bars() chunked
        # (300 symbols/request) same day, tested live against 478 real
        # tickers first -- the original single-request version was only
        # ever verified at golden-10 scale and would likely have hit a
        # URL-length failure at the full ~5,000-ticker population.
        if: always()
        run: uv run --project pipeline scrooner-company-master update-market-price --all-active
      - name: Enforce freshness and dead-letter health
        if: always()
        run: uv run --project pipeline scrooner-operations --fail-on-alert
      - name: Rebuild company/metric/tag coverage matrix
        # The source of truth for "does company X have data point Y, and
        # why not" (analytics.data_point_registry + company_data_point_
        # coverage, doc 41) -- added to the daily cron 2026-09-08, direct
        # user request ("continuously build it... this will be our source
        # of truth for fetching"). Previously only ever rebuilt manually
        # (last real run 2026-09-06), so every concept_mapping/resolve()
        # change since then was invisible to it. Runs BEFORE the aggregate
        # snapshot below since the snapshot's own coverage-percentage
        # queries read the same underlying resolve()/canonical_fact state
        # this matrix also reflects -- keeping them in the same daily
        # pass avoids the two ever silently disagreeing about "as of when".
        if: always()
        run: uv run --project pipeline scrooner-map build-coverage-matrix
      - name: Rebuild XBRL tag-candidate library
        # Retires reference/xbrl_tag_coverage_library.json (2026-09-08,
        # direct user instruction: "retire json, make everything into db
        # as source of truth") -- was a manually-triggered research file,
        # last built 2026-09-02, silently stale ever since. Now
        # analytics.concept_tag_candidate, rebuilt in the same daily pass
        # as the coverage matrix above.
        if: always()
        run: uv run --project pipeline scrooner-map build-tag-candidates
      - name: Record daily coverage snapshot
        if: always()
        run: uv run --project pipeline scrooner-map snapshot-coverage
