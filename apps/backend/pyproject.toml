[project]
name = "scrooner-backend"
version = "0.1.0"
description = "Scrooner's internal product API (doc 16, Part 7) -- a thin FastAPI wrapper over pipeline's already-verified Screener/AI Query. NOT the separate, evidence-gated B2B apps/data-api -- see doc 16's naming clarification."
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    # Process-wide connection pool (db_pool.py) -- psycopg.connect() against
    # this project's Supabase pooler costs ~1.7s per call for TCP+TLS+auth
    # alone (measured live 2026-09-10), which would dominate every request's
    # latency, cached or not, if paid per-request in a long-running service.
    "psycopg-pool>=3.2",
    "scrooner-pipeline",
    # Dataset-versioned screen-result cache (doc/faster-loading/fast.md
    # item 3) -- a deliberate reversal of doc 02's original "No Redis or
    # Celery initially" lock, by explicit founder direction 2026-09-10.
    # See doc/adr/0001-screener-redis-cache-and-boolean-logic.md.
    "redis>=5.0",
]

[tool.uv.sources]
scrooner-pipeline = { path = "../../pipeline", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "unit: fast, deterministic tests with no network or database access",
    "integration: tests that use an explicitly isolated test database",
    "live: opt-in verification against live external services",
]
