[project]
name = "scrooner-admin"
version = "0.1.0"
description = "Staff-only operations cockpit for Scrooner"
requires-python = "==3.12.*"
dependencies = [
    "django>=5.2,<6.0",
    "dj-database-url>=2.2",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "whitenoise>=6.8",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-django>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "cockpit", "coverage", "operations"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
